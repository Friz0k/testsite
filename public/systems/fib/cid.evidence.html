<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Улики CID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #000000; --white: #ffffff;
            --gray: #1a1a1a; --surface: #0a0a0a;
            --border: #333333; --text: #ffffff;
            --text-muted: #a0a0a0; --neon-white: #ffffff;
        }
        body {
            background: var(--black); color: var(--text); min-height: 100vh;
            padding: 20px; font-family: 'Inter', sans-serif; overflow-x: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        #particle-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .container {
            position: relative; z-index: 1; width: 100%; max-width: 900px;
        }
        .card {
            background: rgba(0,0,0,0.9); border-radius: 10px; padding: 30px;
            border: 1px solid var(--neon-white); box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        .header {
            text-align: center; margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px; color: var(--neon-white); letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .header h1 i { margin-right: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 13px; color: var(--neon-white);
            margin-bottom: 8px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px;
        }
        .required::after { content: " *"; color: var(--neon-white); }
        input, textarea, select {
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;
            color: var(--text); font-size: 16px; transition: all 0.3s;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none; border-color: var(--neon-white);
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        select option {
            background: #000;
            color: #fff;
        }
        .evidence-list { margin-bottom: 15px; }
        .evidence-row {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .first-row-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .first-row-fields .input-wrap {
            flex: 1 1 180px;
        }
        .description-row {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .description-row .input-wrap {
            flex: 1;
        }
        .description-row textarea {
            width: 100%;
            min-height: 70px;
            resize: vertical;
        }
        .input-wrap label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .remove-evidence-btn {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-top: 24px;
        }
        .remove-evidence-btn:hover { border-color: var(--neon-white); }
        .add-btn {
            background: transparent; border: 1px dashed rgba(255,255,255,0.3);
            color: var(--text-muted); padding: 12px; border-radius: 8px;
            width: 100%; font-size: 14px; font-weight: 500; cursor: pointer;
            transition: all 0.2s; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .add-btn:hover {
            border-color: var(--neon-white); color: var(--neon-white);
        }
        .buttons {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px;
        }
        button {
            padding: 14px; border: none; border-radius: 8px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .submit-btn {
            background: rgba(255,255,255,0.1); color: white;
            border: 1px solid var(--neon-white);
        }
        .submit-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.2);
        }
        .reset-btn {
            background: rgba(0,0,0,0.5); color: var(--text);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .reset-btn:hover { border-color: var(--neon-white); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading {
            display: none; text-align: center; padding: 20px; color: var(--text-muted);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--neon-white); border-radius: 50%;
            width: 36px; height: 36px; animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result-message {
            padding: 15px; border-radius: 8px; text-align: center;
            display: none; margin-top: 20px; font-size: 14px; white-space: pre-line;
            border: 1px solid;
        }
        .success {
            background: rgba(255,255,255,0.05); color: #fff; border-color: #fff;
            display: block;
        }
        .error {
            background: rgba(255,255,255,0.05); color: #ffaaaa; border-color: #ff4444;
            display: block;
        }
        @media (max-width: 700px) {
            .first-row-fields .input-wrap {
                flex: 1 1 100%;
            }
            .description-row {
                flex-wrap: wrap;
            }
            .remove-evidence-btn {
                width: 100%;
                border-radius: 8px;
                margin-top: 8px;
            }
        }
        @media (max-width: 500px) {
            .buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<canvas id="particle-canvas"></canvas>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-fingerprint"></i>Улики CID</h1>
        </div>
        <div class="form-group">
            <label class="required" for="nickname">Никнейм</label>
            <input type="text" id="nickname" placeholder="Пример: Alexandr Cop">
        </div>
        <div class="form-group">
            <label class="required" for="badgeNumber">Номер жетона</label>
            <input type="text" id="badgeNumber" placeholder="Пример: 405">
        </div>
        <div id="evidence-list"></div>
        <button type="button" class="add-btn" id="add-evidence-btn">
            <i class="fas fa-plus"></i> Добавить улику
        </button>
        <div class="buttons">
            <button type="button" class="submit-btn" id="submit-btn">
                <i class="fas fa-paper-plane"></i> Отправить
            </button>
            <button type="button" class="reset-btn" id="reset-btn">
                <i class="fas fa-redo"></i> Очистить
            </button>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Отправка данных...</p>
        </div>
        <div class="result-message" id="result"></div>
    </div>
</div>
<script>
    (function() {
        var canvas = document.getElementById('particle-canvas');
        var ctx = canvas.getContext('2d');
        var particles = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        function Particle() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.2;
            this.opacity = Math.random() * 0.3 + 0.1;
            this.color = 'rgba(255,255,255,' + this.opacity + ')';
        }
        Particle.prototype.update = function() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
        };
        Particle.prototype.draw = function() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        };
        function initParticles(count) {
            count = count || 70;
            particles = [];
            for (var i = 0; i < count; i++) particles.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        resizeCanvas();
        initParticles(80);
        animateParticles();
        window.addEventListener('resize', function() {
            resizeCanvas();
            initParticles(80);
        });
    })();

    (function() {
        var form = {
            nickname: document.getElementById('nickname'),
            badge: document.getElementById('badgeNumber'),
            list: document.getElementById('evidence-list'),
            addBtn: document.getElementById('add-evidence-btn'),
            submitBtn: document.getElementById('submit-btn'),
            resetBtn: document.getElementById('reset-btn'),
            loading: document.getElementById('loading'),
            result: document.getElementById('result')
        };

        var MAX_EVIDENCE = 15;
        var evidenceCount = 0;

        function createEvidenceRow() {
            var row = document.createElement('div');
            row.className = 'evidence-row';
            row.innerHTML = '<div class="first-row-fields">' +
                '<div class="input-wrap"><label>Название улики</label><input type="text" class="ev-name" placeholder=""></div>' +
                '<div class="input-wrap"><label>Организация</label><select class="ev-org"><option value="">Выберите...</option><option value="RM">RM</option><option value="YAK">YAK</option><option value="AM">AM</option><option value="MM">MM</option><option value="IM">IM</option><option value="LSV">LSV</option><option value="ESB">ESB</option><option value="BSG">BSG</option><option value="MG-13">MG-13</option><option value="FAM">FAM</option></select></div>' +
                '<div class="input-wrap"><label>Ссылка (YouTube/Imgur)</label><input type="url" class="ev-link" placeholder=""></div>' +
                '</div>' +
                '<div class="description-row">' +
                '<div class="input-wrap"><label>Описание (необязательно)</label><textarea class="ev-desc" placeholder=""></textarea></div>' +
                '<button type="button" class="remove-evidence-btn"><i class="fas fa-times"></i></button>' +
                '</div>';
            row.querySelector('.remove-evidence-btn').addEventListener('click', function() {
                row.remove();
                evidenceCount--;
                updateAddButton();
            });
            form.list.appendChild(row);
            evidenceCount++;
            updateAddButton();
        }

        function updateAddButton() {
            form.addBtn.disabled = evidenceCount >= MAX_EVIDENCE;
            form.addBtn.style.opacity = evidenceCount >= MAX_EVIDENCE ? '0.5' : '1';
        }

        form.addBtn.addEventListener('click', createEvidenceRow);
        form.resetBtn.addEventListener('click', function() {
            if (confirm('Очистить все поля?')) {
                form.nickname.value = '';
                form.badge.value = '';
                form.list.innerHTML = '';
                evidenceCount = 0;
                updateAddButton();
                form.result.style.display = 'none';
                form.result.className = 'result-message';
            }
        });

        form.submitBtn.addEventListener('click', async function() {
            var nickname = form.nickname.value.trim();
            var badgeNumber = form.badge.value.trim();
            if (!nickname || !badgeNumber) {
                showMessage('❌ Заполните никнейм и номер жетона', 'error');
                return;
            }

            var evidenceRows = form.list.querySelectorAll('.evidence-row');
            var evidences = [];
            for (var i = 0; i < evidenceRows.length; i++) {
                var row = evidenceRows[i];
                var name = row.querySelector('.ev-name').value.trim();
                var org = row.querySelector('.ev-org').value;
                var desc = row.querySelector('.ev-desc').value.trim();
                var link = row.querySelector('.ev-link').value.trim();
                if (name) {
                    evidences.push({ name: name, organization: org, description: desc, link: link });
                }
            }

            if (evidences.length === 0) {
                showMessage('❌ Добавьте хотя бы одну улику (название обязательно)', 'error');
                return;
            }

            form.submitBtn.disabled = true;
            form.loading.style.display = 'block';
            form.result.style.display = 'none';

            try {
                const res = await fetch('/fib/evidence', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname: nickname, badgeNumber: badgeNumber, evidences: evidences })
                });
                const data = await res.json();
                
                form.loading.style.display = 'none';
                if (data.success) {
                    showMessage(data.message, 'success');
                    setTimeout(function() {
                        form.resetBtn.click();
                    }, 4000);
                } else {
                    showMessage('❌ ' + data.message, 'error');
                }
            } catch (err) {
                form.loading.style.display = 'none';
                showMessage('❌ Ошибка соединения', 'error');
            }
            form.submitBtn.disabled = false;
        });

        function showMessage(text, type) {
            form.result.textContent = text;
            form.result.className = 'result-message ' + type;
            form.result.style.display = 'block';
        }

        createEvidenceRow();
    })();
</script>
</body>
</html>
