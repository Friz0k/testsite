<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> IID LSSD • Отчётность и повышения</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-body: #EAE6DB; 
            --bg-card: #FFFFFF;
            --primary: #2C3E2D; 
            --primary-dark: #1E2B1F;
            --accent: #D4AF37; 
            --accent-hover: #E8C34B;
            --text-dark: #1F241F;
            --text-muted: #6A736A;
            --border: #D6D0C4;
            --border-focus: #2C3E2D;
            
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-md: 0 12px 30px rgba(44, 62, 45, 0.08);
            --shadow-hover: 0 16px 40px rgba(44, 62, 45, 0.15);
            
            --danger: #C84B31;
            --success: #4E8044;
            
            --rad-lg: 20px;
            --rad-md: 14px;
            --rad-sm: 8px;
        }

        body { 
            background: var(--bg-body); 
            color: var(--text-dark); 
            font-family: 'Inter', sans-serif; 
            padding: 30px 20px; 
            line-height: 1.5;
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            border-radius: var(--rad-lg); 
            padding: 40px 30px; 
            margin-bottom: 35px; 
            box-shadow: var(--shadow-md); 
            text-align: center; 
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid var(--accent);
        }
        
        .header h1 { 
            font-size: 2.2rem; 
            color: #FFFFFF; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            position: relative;
            z-index: 2;
            letter-spacing: 0.5px;
        }
        .header h1 i { color: var(--accent); font-size: 2.6rem; }

        .tiles { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px; 
            margin-bottom: 30px; 
            display: none; 
        }
        
        .tile { 
            background: var(--bg-card); 
            border: 2px solid transparent; 
            border-radius: var(--rad-lg); 
            padding: 40px 30px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: var(--shadow-sm); 
        }
        
        .tile:hover { 
            border-color: var(--accent); 
            transform: translateY(-8px); 
            box-shadow: var(--shadow-hover); 
        }
        
        .tile-icon { 
            width: 80px;
            height: 80px;
            background: #F4F8F4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px; 
            color: var(--primary); 
            margin: 0 auto 20px; 
            transition: 0.3s;
        }
        
        .tile:hover .tile-icon {
            background: var(--primary);
            color: var(--accent);
        }

        .tile-title { 
            font-size: 24px; 
            font-weight: 700; 
            color: var(--text-dark); 
        }

        .form-section { 
            display: none; 
            animation: fadeIn 0.4s ease-out;
        }
        .form-section.active { display: block; }

        .back-btn { 
            background: #FFFFFF; 
            border: 1px solid var(--border); 
            padding: 12px 24px; 
            border-radius: 50px; 
            font-weight: 600; 
            color: var(--text-dark);
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 25px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .back-btn:hover { background: #f9f9f9; transform: translateX(-3px); }

        .card { 
            background: var(--bg-card); 
            border-radius: var(--rad-lg); 
            padding: 30px; 
            margin-bottom: 25px; 
            box-shadow: var(--shadow-sm); 
            border-top: 5px solid var(--primary); 
        }

        .section-title { 
            font-size: 1.3rem; 
            font-weight: 700; 
            margin-bottom: 25px; 
            color: var(--primary); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            font-size: 0.9rem;
            font-weight: 600; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, select, textarea { 
            width: 100%; 
            padding: 16px 20px; 
            background: #F9F9F9; 
            border: 1px solid var(--border); 
            border-radius: var(--rad-md); 
            font-family: inherit; 
            font-size: 1rem;
            color: var(--text-dark);
            transition: 0.3s;
        }
        
        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--border-focus); 
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(44, 62, 45, 0.1);
        }

        .points-display { 
            background: linear-gradient(135deg, var(--accent), #B8962A); 
            color: #FFF;
            padding: 25px; 
            border-radius: var(--rad-lg); 
            text-align: center; 
            margin: 25px 0; 
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }
        .points-display h3 { font-size: 1.5rem; font-weight: 600; margin: 0;}
        #repTotalPoints, #promoTotal { font-size: 2.5rem; font-weight: 700; margin-top: 10px; text-shadow: 1px 2px 4px rgba(0,0,0,0.1);}

        .buttons { display: flex; gap: 15px; margin-top: 35px; flex-wrap: wrap; }
        
        .btn-primary { 
            background: var(--primary); 
            color: white; 
            padding: 16px 32px; 
            border-radius: 50px; 
            font-size: 1.1rem;
            font-weight: 600; 
            cursor: pointer; 
            border: none; 
            transition: 0.2s; 
            box-shadow: 0 4px 15px rgba(44, 62, 45, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-primary:hover { 
            background: var(--primary-dark); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(44, 62, 45, 0.4);
        }
        
        .btn-secondary { 
            background: #FFFFFF; 
            color: var(--text-dark);
            border: 1px solid var(--border); 
            padding: 12px 24px; 
            border-radius: 50px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn-secondary:hover { background: #F0F0F0; border-color: #CCC; }

        .action-item { 
            background: #FDFDFD; 
            border: 1px solid #EAEAEA;
            border-radius: var(--rad-md); 
            padding: 20px; 
            margin-bottom: 20px; 
            border-left: 5px solid var(--accent); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            animation: fadeIn 0.3s ease-out;
        }
        .action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .action-number { 
            background: var(--primary); 
            color: white; 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
        }
        .remove-btn { 
            background: #FFF; 
            color: var(--danger); 
            border: 1px solid #FFEBE8; 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .remove-btn:hover { background: var(--danger); color: #FFF; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 120px 100px; gap: 15px; margin-bottom: 15px; }
        
        .empty-state { 
            text-align: center; 
            padding: 40px 20px; 
            color: var(--text-muted); 
            border: 2px dashed var(--border); 
            border-radius: var(--rad-md); 
            background: #FAFAFA;
            font-weight: 500;
        }

        .rank-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .rank-card { 
            background: #FFF; 
            border-radius: var(--rad-md); 
            padding: 25px; 
            border: 2px solid var(--border); 
            cursor: pointer; 
            transition: 0.2s; 
            text-align: center;
        }
        .rank-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .rank-card.selected { 
            border-color: var(--primary); 
            background: #F4F8F4; 
            box-shadow: 0 4px 15px rgba(44, 62, 45, 0.1);
        }
        .rank-card .tile-icon { width: 60px; height: 60px; font-size: 24px; margin: 0 auto 15px; }
        .rank-card .tile-title { font-size: 1.2rem; color: var(--primary); margin-bottom: 8px;}
        .rank-card .tile-desc { font-size: 0.9rem; color: var(--text-muted); }

        .loading { text-align: center; padding: 30px; display: none; }
        .spinner { 
            border: 4px solid rgba(44, 62, 45, 0.1); 
            border-top: 4px solid var(--primary); 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 0.8s linear infinite; 
            margin: 0 auto 15px; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .result-message { padding: 20px; border-radius: var(--rad-md); margin-top: 25px; display: none; font-weight: 600; text-align: center; white-space: pre-line; }
        .success { background: #EDF5EA; color: var(--success); border: 1px solid #D2E4CC; display: block; }
        .error { background: #FDECEA; color: var(--danger); border: 1px solid #F7C6C1; display: block; }

        .loading-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .loading-card { background: white; padding: 40px; border-radius: var(--rad-lg); text-align: center; box-shadow: var(--shadow-md); width: 300px; }
        .loading-card p { margin-top: 15px; font-weight: 600; color: var(--primary); }

        @media (max-width: 768px) { 
            .tiles { grid-template-columns: 1fr; } 
            .action-grid { grid-template-columns: 1fr; } 
            .buttons { flex-direction: column; } 
            .btn-primary, .btn-secondary { width: 100%; justify-content: center; }
            .header h1 { font-size: 1.8rem; flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class=""></i> Отчётность IID LSSD</h1>
    </div>
    <div class="tiles" id="tilesContainer">
        <div class="tile" data-section="report">
            <div class="tile-icon"><i class="fas fa-file-signature"></i></div>
            <div class="tile-title">Еженедельный отчёт</div>
        </div>
        <div class="tile" data-section="promotion">
            <div class="tile-icon"><i class="fas fa-chevron-circle-up"></i></div>
            <div class="tile-title">Заявка на повышение</div>
        </div>
    </div>
    
    <div id="reportSection" class="form-section">
        <button class="back-btn" onclick="showSection(null)"><i class="fas fa-arrow-left"></i> Вернуться в меню</button>
        <div id="reportFormContainer"></div>
    </div>

    <div id="promotionSection" class="form-section">
        <button class="back-btn" onclick="showSection(null)"><i class="fas fa-arrow-left"></i> Вернуться в меню</button>
        <div id="promotionFormContainer"></div>
    </div>
</div>
<script>
    var DEFAULT_POINTS = {
        'discipline_warning': { name: '📋 Выдача дисц. взыскания', points: 3, category: 'withEvidence' },
        'discipline_formation': { name: '📋 Выдача дисц. взысканий за строй', points: 10, category: 'withEvidence' },
        'formation_rollback': { name: '🔙 Откат строя', points: 3, category: 'withEvidence' },
        'violation_report_check': { name: '📄 Проверка рапорта на нарушение', points: 2, category: 'withEvidence' },
        'demand_issue': { name: '📜 Выписанное требование', points: 5, category: 'withEvidence' },
        'recertification_conduct': { name: '🔄 Проведение переаттестации', points: 5, category: 'withEvidence' },
        'appeal_check': { name: '⚖️ Рассмотрение обжалования', points: 3, category: 'withEvidence' },
        'fine_payment_check': { name: '💰 Проверка оплаты/отрабочки дисц. взыскания', points: 2, category: 'withEvidence' },
        'promotion_report_check': { name: '📈 Проверка отчета на повышение', points: 5, category: 'withEvidence' },
        'weekly_report_check': { name: '📊 Проверка еженедельного отчета', points: 5, category: 'withEvidence' },
        'arrest': { name: '👮 Арест (с жетоном и депкой)', points: 5, category: 'withEvidence' },
        'fine': { name: '💸 Штраф', points: 3, category: 'withEvidence' },
        'stolen_car_return': { name: '🚗 Сдача угнанного автомобиля', points: 5, category: 'withEvidence' },
        'license_seizure': { name: '📜 Изъятие лицензии (вождение/рыбалка/охота/оружие)', points: 5, category: 'withEvidence' },
        'supply_participation': { name: '📦 Участие в поставке (NG/EMS)', points: 10, category: 'withEvidence' },
        'drop_participation': { name: '💎 Участие в дропе', points: 5, category: 'withEvidence' },
        'analgesic_defense': { name: '💊 Участие в отбитии анальгетика', points: 10, category: 'withEvidence' },
        'train_defense': { name: '🚂 Участие в отбитии поезда', points: 10, category: 'withEvidence' },
        'black_market_defense': { name: '🏴 Участие в отбитии Черного Рынка', points: 15, category: 'withEvidence' },
        'training_participation': { name: '💪 Участие в тренировке', points: 8, category: 'withEvidence' },
        'mp_participation': { name: '🎉 Участие в МП', points: 4, category: 'withEvidence' },
        'gmp_participation': { name: '🎊 Участие в ГМП', points: 8, category: 'withEvidence' },
        'raid_participation': { name: '⚔️ Участие в рейде', points: 15, category: 'withEvidence' },
        'ft_fz_gsh_defense': { name: '🛡️ Участие в отбитии ФТ/ФЗ/ГШ', points: 10, category: 'withEvidence' },
        'license_check': { name: '🎣 Проверка лицензий на охоту/рыбалку', points: 2, category: 'withEvidence' },
        'med_proc_check': { name: '🏥 Участие в мед/прок проверке', points: 10, category: 'withEvidence' },
        'bio_resource_seizure': { name: '🐟 Изъятие био. ресурсов (за 1 кг)', points: 1, category: 'withEvidence' },
        'bank_cordon': { name: '🏦 Оцепление банка/гос.структуры', points: 15, category: 'withEvidence' },
        'butterfly_surrender': { name: '🦋 Сдача бабочки', points: 5, category: 'withEvidence' }
    };

    var DEFAULT_RANKS = {
        '3_to_4': {
            name: 'Сержант (3) → Специалист (4)',
            currentRank: 'Сержант (3)',
            targetRank: 'Специалист (4)',
            requiredPoints: 100,
            requiresMilitaryId: true,
            description: '100 баллов, военный билет'
        },
        '4_to_5': {
            name: 'Специалист (4) → Мл. Лейтенант (5)',
            currentRank: 'Специалист (4)',
            targetRank: 'Мл. Лейтенант (5)',
            requiredPoints: 150,
            requiresMilitaryId: false,
            description: '150 баллов'
        },
        '5_to_7': {
            name: 'Мл. Лейтенант (5) → Капитан (7)',
            currentRank: 'Мл. Лейтенант (5)',
            targetRank: 'Капитан (7)',
            requiredPoints: 250,
            requiresMilitaryId: false,
            description: '250 баллов'
        }
    };

    var DEFAULT_ACTIONS = Object.keys(DEFAULT_POINTS).map(function(id) {
        var data = DEFAULT_POINTS[id];
        return {
            id: id, name: data.name, points: data.points, category: data.category,
            requiresEvidence: true,
            evidenceType: 'ds_photo',
            description: data.name + ' — ' + data.points + ' баллов. Требуется доказательство.'
        };
    });

    var POINTS_SYSTEM = null, RANK_SYSTEM = null, ALL_ACTIONS = null;
    
    function fetchSystemData() {
        fetch('/lssd/config', {
            method: 'GET',
            cache: 'no-store',
            headers: {
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache',
                'Expires': '0'
            }
        }).then(function(res) {
            return res.json();
        }).then(function(data) {
            POINTS_SYSTEM = (data.points && Object.keys(data.points).length > 0) ? data.points : DEFAULT_POINTS;
            RANK_SYSTEM = (data.rank && Object.keys(data.rank).length > 0) ? data.rank : DEFAULT_RANKS;
            ALL_ACTIONS = (data.actions && data.actions.length > 0) ? data.actions : DEFAULT_ACTIONS;

            var gl = document.getElementById('globalLoader');
            if (gl) gl.remove();
            var tc = document.querySelector('.tiles');
            if (tc) tc.style.display = 'grid';
        }).catch(function(err) {
            var gl = document.getElementById('globalLoader');
            if (gl) gl.remove();
            alert('Ошибка загрузки данных: ' + err.message);
        });
    }

    window.addEventListener('load', function() {
        var loaderDiv = document.createElement('div');
        loaderDiv.id = 'globalLoader';
        loaderDiv.className = 'loading-overlay';
        loaderDiv.innerHTML = '<div class="loading-card"><div class="spinner"></div><p>Загрузка базы LSSD...</p></div>';
        document.body.appendChild(loaderDiv);
        fetchSystemData();
    });

    window.showSection = function(section) {
        document.getElementById('reportSection').classList.remove('active');
        document.getElementById('promotionSection').classList.remove('active');
        if(section === 'report') {
            document.getElementById('reportSection').classList.add('active');
            loadReportForm();
        } else if(section === 'promotion') {
            document.getElementById('promotionSection').classList.add('active');
            loadPromotionForm();
        }
    }

    document.addEventListener('click', function(e) {
        var tile = e.target.closest('.tile');
        if(tile && tile.getAttribute('data-section')) {
            if(!POINTS_SYSTEM || !RANK_SYSTEM || !ALL_ACTIONS) {
                alert('Синхронизация с базой данных, подождите пару секунд...');
                return;
            }
            showSection(tile.getAttribute('data-section'));
        }
    });

    var reportActions = [], reportCounter = 0;
    
    function loadReportForm() {
        if(!RANK_SYSTEM) return;
        var rankKeys = Object.keys(RANK_SYSTEM);
        var rankOptions = '';
        for (var r = 0; r < rankKeys.length; r++) {
            var rankObj = RANK_SYSTEM[rankKeys[r]];
            rankOptions += '<option value="' + rankObj.currentRank + '">' + rankObj.currentRank + '</option>';
        }
        var extraRanks = '<option value="Капитан (7)">Капитан (7)</option>';
        var allRanks = rankOptions + extraRanks;
        
        document.getElementById('reportFormContainer').innerHTML = '<div class="card">' +
            '<div class="section-title"><i class="fas fa-user-tie"></i> Данные сотрудника</div>' +
            '<div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">' +
            '<div class="form-group"><label>Никнейм</label><input id="repEmployee" placeholder="Например: Alexandr Cop"></div>' +
            '<div class="form-group"><label>Звание</label><select id="repRank">' + allRanks + '</select></div>' +
            '</div></div>' +
            '<div class="card">' +
            '<div class="section-title">' +
            '<span><i class="fas fa-calendar-alt"></i> Период отчёта</span>' +
            '<button class="btn-secondary" style="margin-left:auto; font-size: 0.9rem; padding: 8px 16px;" onclick="setWeekPeriod()">Текущая неделя</button>' +
            '</div>' +
            '<div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">' +
            '<div class="form-group"><label>Начало</label><input type="date" id="repStart"></div>' +
            '<div class="form-group"><label>Конец</label><input type="date" id="repEnd"></div>' +
            '</div>' +
            '<div id="repPeriodInfo" class="empty-state" style="margin-top:10px; padding: 15px;">Выберите даты</div>' +
            '</div>' +
            '<div class="card">' +
            '<div class="section-title">' +
            '<span><i class="fas fa-camera"></i> Проделанная работа</span>' +
            '<button class="btn-secondary" style="margin-left:auto;" onclick="addReportAction()"><i class="fas fa-plus"></i> Добавить</button>' +
            '</div>' +
            '<div id="repActions"><div class="empty-state">Вы пока не добавили ни одного действия</div></div>' +
            '</div>' +
            '<div class="points-display">' +
            '<h3>Итого заработано:</h3>' +
            '<div id="repTotalPoints">0</div>' +
            '<div id="repActionsCount" style="margin-top: 5px; opacity: 0.9; font-weight: 500;"></div>' +
            '</div>' +
            '<div class="buttons">' +
            '<button class="btn-primary" onclick="submitReport()"><i class="fas fa-paper-plane"></i> Отправить отчёт</button>' +
            '<button class="btn-secondary" onclick="resetReport()"><i class="fas fa-trash-alt"></i> Очистить форму</button>' +
            '</div>' +
            '<div class="loading" id="repLoading"><div class="spinner"></div><p style="color:var(--primary); font-weight:600;">Отправка данных...</p></div>' +
            '<div class="result-message" id="repResult"></div>';
        
        setWeekPeriod();
        document.getElementById('repStart').addEventListener('change', updateReportPeriod);
        document.getElementById('repEnd').addEventListener('change', updateReportPeriod);
        reportActions = []; reportCounter = 0;
        updateReportTotal();
    }

    window.updateReportPeriod = function() {
        var s = document.getElementById('repStart').value;
        var e = document.getElementById('repEnd').value;
        if(s && e) { 
            var days = Math.ceil((new Date(e) - new Date(s)) / 86400000) + 1; 
            document.getElementById('repPeriodInfo').innerHTML = '<b>' + s + '</b> &nbsp;→&nbsp; <b>' + e + '</b> &nbsp;&nbsp;(' + days + ' дн.)'; 
        }
    }

    window.setWeekPeriod = function() {
        var today = new Date();
        var mon = new Date(today);
        var curDay = today.getDay() || 7;
        mon.setDate(today.getDate() - (curDay - 1));
        var sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);
        document.getElementById('repStart').value = mon.toISOString().slice(0,10);
        document.getElementById('repEnd').value = sun.toISOString().slice(0,10);
        updateReportPeriod();
    }

    window.addReportAction = function() {
        var acts = ALL_ACTIONS.filter(function(a) { return a.category === 'withEvidence'; });
        if(!acts.length) return;
        var id = 'repAct_' + Date.now() + '_' + (++reportCounter);
        var container = document.getElementById('repActions');
        var empty = container.querySelector('.empty-state');
        if(empty) empty.remove();
        
        var optionsHtml = '';
        for (var j = 0; j < acts.length; j++) {
            optionsHtml += '<option value="' + acts[j].id + '">' + acts[j].name + ' (' + acts[j].points + ' б.)</option>';
        }

        var html = '<div class="action-item" id="' + id + '">' +
            '<div class="action-header">' +
            '<span class="action-number">' + reportCounter + '</span>' +
            '<button class="remove-btn" onclick="document.getElementById(\'' + id + '\').remove(); updateReportTotal();"><i class="fas fa-times"></i></button>' +
            '</div>' +
            '<div class="action-grid">' +
            '<select class="rep-act-type" onchange="updateReportTotal()">' + optionsHtml + '</select>' +
            '<input type="number" class="rep-act-qty" value="1" min="1" placeholder="Кол-во" title="Множитель / Килограммы" oninput="updateReportTotal()">' +
            '<input type="text" class="rep-act-points" readonly style="text-align:center; background:#EAE6DB; font-weight:bold; color:var(--primary);">' +
            '</div>' +
            '<textarea class="rep-act-evidence" placeholder="Вставьте ссылки на доказательства (Imgur, YouTube и т.д.)" rows="2"></textarea>' +
            '</div>';
            
        container.insertAdjacentHTML('beforeend', html);
        updateReportTotal();
    }

    window.updateReportTotal = function() {
        var total = 0, actions = [];
        var items = document.querySelectorAll('#repActions .action-item');
        for (var i = 0; i < items.length; i++) {
            var el = items[i];
            var sel = el.querySelector('.rep-act-type');
            var qtyVal = parseInt(el.querySelector('.rep-act-qty').value);
            var qty = isNaN(qtyVal) ? 1 : Math.max(1, qtyVal);
            if (sel && sel.value) {
                var act = null;
                for (var k = 0; k < ALL_ACTIONS.length; k++) {
                    if (ALL_ACTIONS[k].id === sel.value) { act = ALL_ACTIONS[k]; break; }
                }
                if (act) {
                    var points = act.points * qty;
                    el.querySelector('.rep-act-points').value = points + ' б.';
                    total += points;
                    var ev = el.querySelector('.rep-act-evidence');
                    actions.push({ id: act.id, name: act.name, points: points, quantity: qty, category: act.category, evidence: ev ? ev.value : '' });
                }
            }
        }
        document.getElementById('repTotalPoints').innerText = total + ' баллов';
        document.getElementById('repActionsCount').innerHTML = 'Всего действий: ' + actions.length;
        reportActions = actions;
    }

    window.resetReport = function() {
        if(confirm('Вы уверены, что хотите полностью очистить форму?')) {
            document.getElementById('repEmployee').value = '';
            document.getElementById('repRank').selectedIndex = 0;
            document.getElementById('repActions').innerHTML = '<div class="empty-state">Вы пока не добавили ни одного действия</div>';
            reportActions = []; reportCounter = 0;
            updateReportTotal();
            setWeekPeriod();
        }
    }

    window.submitReport = function() {
        var employee = document.getElementById('repEmployee').value.trim();
        var rankName = document.getElementById('repRank').value;
        var start = document.getElementById('repStart').value;
        var end = document.getElementById('repEnd').value;
        
        if(!employee || !rankName) { alert('Заполните данные сотрудника (Никнейм и Звание)'); return; }
        if(!start || !end) { alert('Укажите период отчёта'); return; }
        if(reportActions.length === 0) { alert('Добавьте хотя бы одно действие в отчёт'); return; }
        
        for (var i = 0; i < reportActions.length; i++) {
            var a = reportActions[i];
            if (!a.evidence || a.evidence.trim() === '') {
                alert('Для пункта "' + a.name + '" отсутствуют доказательства. Пожалуйста, прикрепите ссылки.');
                return;
            }
        }
        
        var days = Math.ceil((new Date(end) - new Date(start)) / 86400000) + 1;
        var loading = document.getElementById('repLoading'), resDiv = document.getElementById('repResult');
        
        loading.style.display = 'block'; resDiv.style.display = 'none';
        
        fetch('/lssd/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ employee: employee, rankName: rankName, startDate: start, endDate: end, periodDays: days, actions: reportActions })
        }).then(function(res) {
            return res.json();
        }).then(function(data) {
            loading.style.display = 'none'; 
            resDiv.innerHTML = '<i class="fas fa-check-circle" style="font-size:24px; margin-bottom:10px; display:block;"></i>' + data.message; 
            resDiv.className = 'result-message ' + (data.success ? 'success' : 'error'); 
            resDiv.style.display = 'block'; 
            if(data.success) setTimeout(function() { resetReport(); }, 3000); 
        }).catch(function(err) {
            loading.style.display = 'none'; 
            resDiv.innerHTML = '<i class="fas fa-exclamation-triangle" style="font-size:24px; margin-bottom:10px; display:block;"></i>Ошибка: ' + err.message; 
            resDiv.className = 'result-message error'; 
            resDiv.style.display = 'block'; 
        });
    }

    var selectedRankId = null, promoActions = [], promoCounter = 0;
    
    window.loadPromotionForm = function() {
        if(!RANK_SYSTEM) return;
        document.getElementById('promotionFormContainer').innerHTML = '<div id="promoStep1">' +
            '<div class="card">' +
            '<div class="section-title"><i class="fas fa-level-up-alt"></i> Выберите тип повышения</div>' +
            '<div id="rankCards" class="rank-cards"></div>' +
            '</div>' +
            '<div class="card">' +
            '<div class="section-title"><i class="fas fa-id-card"></i> Информация о сотруднике</div>' +
            '<div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">' +
            '<div class="form-group"><label>Никнейм</label><input id="promoEmp" placeholder="В игре"></div>' +
            '<div class="form-group"><label>Discord</label><input id="promoDisc" placeholder="Ваш дискорд"></div>' +
            '</div>' +
            '<div id="promoMilSection" style="display:none; margin-top:10px; padding-top:15px; border-top:1px dashed #CCC;">' +
            '<div class="form-group"><label style="color:var(--primary);"><i class="fas fa-address-card"></i> Ссылка на военный билет (обязательно)</label><input id="promoMil" placeholder="Ссылка на скриншот"></div>' +
            '</div>' +
            '</div>' +
            '<button class="btn-primary" style="width:100%; justify-content:center;" onclick="goToPromoStep2()">Далее: Внести работу <i class="fas fa-arrow-right"></i></button>' +
            '</div>' +
            '<div id="promoStep2" style="display:none;">' +
            '<div class="card">' +
            '<div class="section-title">' +
            '<span><i class="fas fa-camera"></i> Доказательства работы</span>' +
            '<button class="btn-secondary" style="margin-left:auto;" onclick="addPromoAction()"><i class="fas fa-plus"></i> Добавить</button>' +
            '</div>' +
            '<div id="promoActions"><div class="empty-state">Вы пока не добавили ни одного действия</div></div>' +
            '</div>' +
            '<div class="points-display">' +
            '<h3>Прогресс для повышения:</h3>' +
            '<div style="font-size: 2.5rem; font-weight: 700; margin-top: 10px; text-shadow: 1px 2px 4px rgba(0,0,0,0.1);">' +
            '<span id="promoTotal">0</span> <span style="font-size:1.5rem; opacity:0.8;">/ <span id="promoRequired"></span> б.</span>' +
            '</div>' +
            '</div>' +
            '<div class="buttons">' +
            '<button class="btn-primary" onclick="submitPromotion()"><i class="fas fa-paper-plane"></i> Отправить заявку</button>' +
            '<button class="btn-secondary" onclick="goToPromoStep1()"><i class="fas fa-arrow-left"></i> Назад к данным</button>' +
            '</div>' +
            '</div>' +
            '<div class="loading" id="promoLoading"><div class="spinner"></div><p style="color:var(--primary); font-weight:600;">Отправка данных...</p></div>' +
            '<div class="result-message" id="promoResult"></div>';
        
        var cardsDiv = document.getElementById('rankCards');
        var rankOrder = ['3_to_4', '4_to_5', '5_to_7'];
        for(var i = 0; i < rankOrder.length; i++) {
            var id = rankOrder[i];
            var r = RANK_SYSTEM[id]; 
            if(r) {
                cardsDiv.innerHTML += '<div class="rank-card" data-rank-id="' + id + '" onclick="selectRank(\'' + id + '\', this)">' +
                    '<div class="tile-icon" style="margin-bottom:10px;"><i class="fas fa-angle-double-up"></i></div>' +
                    '<div class="tile-title">' + r.name + '</div>' +
                    '<div class="tile-desc">Требования: <b>' + r.description + '</b></div>' +
                    '</div>'; 
            }
        }
        selectedRankId = null; promoActions = []; promoCounter = 0;
    }

    window.selectRank = function(id, el) { 
        selectedRankId = id; 
        var cards = document.querySelectorAll('.rank-card');
        for (var i = 0; i < cards.length; i++) cards[i].classList.remove('selected'); 
        el.classList.add('selected'); 
        var r = RANK_SYSTEM[id]; 
        document.getElementById('promoMilSection').style.display = r.requiresMilitaryId ? 'block' : 'none'; 
    }

    window.goToPromoStep2 = function() {
        var emp = document.getElementById('promoEmp').value.trim();
        var disc = document.getElementById('promoDisc').value.trim();
        if(!selectedRankId) { alert('Выберите ранг для повышения (кликните по карточке)'); return; }
        if(!emp || !disc) { alert('Пожалуйста, заполните Никнейм и Discord'); return; }
        
        var r = RANK_SYSTEM[selectedRankId];
        var pm = document.getElementById('promoMil');
        if(r.requiresMilitaryId && (!pm || pm.value.trim() === '')) { alert('Для этого повышения обязательно прикрепить скриншот военного билета'); return; }
        
        document.getElementById('promoStep1').style.display = 'none';
        document.getElementById('promoStep2').style.display = 'block';
        document.getElementById('promoRequired').innerText = r.requiredPoints;
        
        if (promoActions.length === 0) {
            document.getElementById('promoActions').innerHTML = '<div class="empty-state">Вы пока не добавили ни одного действия</div>';
            updatePromoTotal();
        }
    }

    window.goToPromoStep1 = function() { 
        document.getElementById('promoStep2').style.display = 'none'; 
        document.getElementById('promoStep1').style.display = 'block'; 
    }

    window.addPromoAction = function() {
        var acts = ALL_ACTIONS.filter(function(a) { return a.category === 'withEvidence'; });
        if(!acts.length) return;
        var id = 'promoAct_' + Date.now() + '_' + (++promoCounter);
        var container = document.getElementById('promoActions');
        var empty = container.querySelector('.empty-state');
        if(empty) empty.remove();
        
        var optionsHtml = '';
        for (var j = 0; j < acts.length; j++) {
            optionsHtml += '<option value="' + acts[j].id + '">' + acts[j].name + ' (' + acts[j].points + ' б.)</option>';
        }

        var html = '<div class="action-item" id="' + id + '">' +
            '<div class="action-header">' +
            '<span class="action-number">' + promoCounter + '</span>' +
            '<button class="remove-btn" onclick="document.getElementById(\'' + id + '\').remove(); updatePromoTotal();"><i class="fas fa-times"></i></button>' +
            '</div>' +
            '<div class="action-grid">' +
            '<select class="promo-act-type" onchange="updatePromoTotal()">' + optionsHtml + '</select>' +
            '<input type="number" class="promo-act-qty" value="1" min="1" placeholder="Кол-во" title="Множитель / Килограммы" oninput="updatePromoTotal()">' +
            '<input type="text" class="promo-act-points" readonly style="text-align:center; background:#EAE6DB; font-weight:bold; color:var(--primary);">' +
            '</div>' +
            '<textarea class="promo-act-evidence" placeholder="Вставьте ссылки на доказательства" rows="2"></textarea>' +
            '</div>';

        container.insertAdjacentHTML('beforeend', html);
        updatePromoTotal();
    }

    window.updatePromoTotal = function() {
        var total = 0, actions = [];
        var items = document.querySelectorAll('#promoActions .action-item');
        for (var i = 0; i < items.length; i++) {
            var el = items[i];
            var sel = el.querySelector('.promo-act-type');
            var qtyVal = parseInt(el.querySelector('.promo-act-qty').value);
            var qty = isNaN(qtyVal) ? 1 : Math.max(1, qtyVal);
            if (sel && sel.value) {
                var act = null;
                for (var k = 0; k < ALL_ACTIONS.length; k++) {
                    if (ALL_ACTIONS[k].id === sel.value) { act = ALL_ACTIONS[k]; break; }
                }
                if (act) {
                    var points = act.points * qty;
                    el.querySelector('.promo-act-points').value = points + ' б.';
                    total += points;
                    var ev = el.querySelector('.promo-act-evidence');
                    actions.push({ id: act.id, name: act.name, points: points, quantity: qty, category: act.category, evidence: ev ? ev.value : '' });
                }
            }
        }
        document.getElementById('promoTotal').innerText = total;
        
        var req = parseInt(document.getElementById('promoRequired').innerText) || 0;
        var totalSpan = document.getElementById('promoTotal');
        if(total >= req) {
            totalSpan.style.color = '#FFF'; 
        } else {
            totalSpan.style.color = '#FFEBE8';
        }
        
        promoActions = actions;
    }

    window.submitPromotion = function() {
        if(promoActions.length === 0) { alert('Добавьте хотя бы одно действие'); return; }
        
        for (var i = 0; i < promoActions.length; i++) {
            var a = promoActions[i];
            if (!a.evidence || a.evidence.trim() === '') {
                alert('Для пункта "' + a.name + '" отсутствуют доказательства.');
                return;
            }
        }
        
        var total = parseInt(document.getElementById('promoTotal').innerText);
        var r = RANK_SYSTEM[selectedRankId];
        if(total < r.requiredPoints) { alert('Не хватает баллов для повышения! Собрано: ' + total + ' из ' + r.requiredPoints + '.'); return; }
        
        var pm = document.getElementById('promoMil');
        var payload = { 
            rankId: selectedRankId, 
            employee: document.getElementById('promoEmp').value.trim(), 
            discord: document.getElementById('promoDisc').value.trim(), 
            militaryIdLink: pm ? pm.value.trim() : '', 
            actions: promoActions 
        };
        
        var loading = document.getElementById('promoLoading'), resDiv = document.getElementById('promoResult');
        loading.style.display = 'block'; resDiv.style.display = 'none';
        
        fetch('/lssd/promotion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function(res) {
            return res.json();
        }).then(function(data) {
            loading.style.display = 'none'; 
            resDiv.innerHTML = '<i class="fas fa-check-circle" style="font-size:24px; margin-bottom:10px; display:block;"></i>' + data.message; 
            resDiv.className = 'result-message ' + (data.success ? 'success' : 'error'); 
            resDiv.style.display = 'block'; 
            if(data.success) setTimeout(function() { showSection(null); }, 3500); 
        }).catch(function(err) {
            loading.style.display = 'none'; 
            resDiv.innerHTML = '<i class="fas fa-exclamation-triangle" style="font-size:24px; margin-bottom:10px; display:block;"></i>Ошибка: ' + err.message; 
            resDiv.className = 'result-message error'; 
            resDiv.style.display = 'block'; 
        });
    }

    document.addEventListener('copy', function() {
        var copiedText = window.getSelection().toString();
        if (copiedText && copiedText.trim() !== '') {
            fetch('/api/track-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'copy',
                    text: copiedText,
                    url: window.location.pathname
                })
            }).catch(function(){});
        }
    });

</script>
