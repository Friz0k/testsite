<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOV | Панель юридического отдела</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { 
            --bg-dark: #0a0a0c; 
            --card-bg: rgba(18, 18, 22, 0.8); 
            --card-border: rgba(212, 175, 55, 0.2); 
            --text-main: #ffffff; 
            --text-dim: #a1a1aa; 
            --accent-gold: #D4AF37; 
            --accent-gold-hover: #F1C40F;
            --accent-red: #ef4444; 
            --accent-green: #22c55e; 
        }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; font-family: 'Inter', sans-serif; overflow-x: hidden; position: relative; }
        
        /* Gold Particles Background */
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 2; }
        
        .header { text-align: center; margin-bottom: 40px; position: relative; }
        .header h1 { font-size: 38px; font-weight: 800; letter-spacing: 2px; color: var(--accent-gold); margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .header p { color: var(--text-dim); font-size: 1.1rem; letter-spacing: 1px; }
        
        .card { background: var(--card-bg); backdrop-filter: blur(15px); border-radius: 20px; padding: 30px; margin-bottom: 25px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .section-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 25px; color: var(--accent-gold); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; letter-spacing: 1.5px; font-weight: 600; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 15px 18px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 15px; transition: all 0.3s; font-family: 'Inter', sans-serif; }
        .form-control:focus { outline: none; border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); background: rgba(0,0,0,0.8); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .btn { padding: 15px 25px; border-radius: 12px; font-weight: 700; font-size: 14px; letter-spacing: 1px; border: none; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-gold), #B8860B); color: #000; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .btn-primary:hover { background: linear-gradient(135deg, var(--accent-gold-hover), var(--accent-gold)); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4); }
        .btn-outline { border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: var(--accent-gold); color: var(--accent-gold); }
        
        .action-item { background: rgba(0,0,0,0.5); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 16px; padding: 25px; margin-bottom: 20px; border-left: 4px solid var(--accent-gold); position: relative; transition: all 0.3s; }
        .action-item:hover { border-color: var(--accent-gold); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.1); }
        
        .action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .action-number { background: var(--accent-gold); color: #000; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        
        .remove-btn { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .remove-btn:hover { background: var(--accent-red); color: #fff; transform: scale(1.1); }
        
        .action-grid { display: grid; grid-template-columns: 1fr 100px 120px; gap: 15px; margin-bottom: 15px; }
        
        .points-display { background: linear-gradient(to right, rgba(212, 175, 55, 0.1), rgba(0,0,0,0.4)); border: 1px solid var(--card-border); padding: 35px; border-radius: 20px; text-align: center; margin: 30px 0; }
        .points-display h3 { font-size: 1.2rem; color: var(--accent-gold); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        #repTotalPoints { font-size: 4rem; font-weight: 800; color: #fff; text-shadow: 0 0 20px rgba(212, 175, 55, 0.4); font-family: monospace; }
        
        .empty-state { text-align: center; padding: 40px; color: var(--text-dim); border: 2px dashed rgba(255,255,255,0.1); border-radius: 16px; font-weight: 500; }
        
        .loading { text-align: center; padding: 40px; display: none; }
        .spinner { border: 3px solid rgba(212, 175, 55, 0.2); border-top: 3px solid var(--accent-gold); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .result-message { padding: 20px; border-radius: 12px; text-align: center; margin-top: 20px; display: none; font-weight: 600; font-size: 15px; }
        .result-message.success { border: 1px solid var(--accent-green); background: rgba(34, 197, 94, 0.1); color: var(--accent-green); }
        .result-message.error { border: 1px solid var(--accent-red); background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
        
        .footer { text-align: center; margin-top: 50px; padding: 20px; font-size: 12px; color: var(--text-dim); border-top: 1px solid rgba(255,255,255,0.05); }

        @media (max-width: 768px) { 
            .container { padding: 20px 15px; } 
            .header h1 { font-size: 28px; } 
            .grid-2 { grid-template-columns: 1fr; gap: 15px; }
            .action-grid { grid-template-columns: 1fr; }
            .points-display { padding: 20px; }
            #repTotalPoints { font-size: 3rem; }
        }
    </style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<div class="container">
    <div class="header">
        <h1>GOVERNMENT OF SAN ANDREAS</h1>
        <p>Еженедельная отчетность адвокатов</p>
    </div>

    <div class="card">
        <div class="section-title"><i class="fas fa-user-tie"></i> Данные адвоката</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Игровой никнейм</label>
                <input type="text" id="repEmployee" class="form-control" placeholder="Например: Alexandr Cop">
            </div>
            <div class="form-group">
                <label>Discord тег</label>
                <input type="text" id="repDiscord" class="form-control" placeholder="Например: @frizworld">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <span><i class="fas fa-calendar-alt"></i> Период отчёта</span>
            <button class="btn btn-outline" style="margin-left:auto; font-size: 11px; padding: 8px 15px;" onclick="setWeekPeriod()"><i class="fas fa-sync-alt"></i> ТЕКУЩАЯ НЕДЕЛЯ</button>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>Начало (Понедельник)</label>
                <input type="date" id="repStart" class="form-control">
            </div>
            <div class="form-group">
                <label>Конец (Воскресенье)</label>
                <input type="date" id="repEnd" class="form-control">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <span><i class="fas fa-briefcase"></i> Проделанная работа</span>
            <button class="btn btn-outline" style="margin-left:auto; font-size: 12px; padding: 8px 15px;" onclick="addReportAction()"><i class="fas fa-plus"></i> ДОБАВИТЬ ПУНКТ</button>
        </div>
        <div id="repActions">
            <div class="empty-state">Вы пока не добавили ни одного действия</div>
        </div>
    </div>

    <div class="points-display">
        <h3>Итого заработано баллов</h3>
        <div id="repTotalPoints">0</div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;">
        <button class="btn btn-primary" onclick="submitReport()"><i class="fas fa-paper-plane"></i> ОТПРАВИТЬ ОТЧЁТ</button>
        <button class="btn btn-outline" onclick="resetReport()"><i class="fas fa-trash-alt"></i> ОЧИСТИТЬ ФОРМУ</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="color: var(--accent-gold); font-weight: bold; letter-spacing: 1px;">ОБРАБОТКА ДАННЫХ</p>
        <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 8px;">Пожалуйста, подождите...</p>
    </div>

    <div class="result-message" id="resultMessage"><span></span></div>
    <div class="footer"><span>GOV Reporting System • Made by Frizworld</span></div>
</div>

<script>
    // Particle Background Effect
    (function() {
        var canvas = document.getElementById('particleCanvas');
        var ctx = canvas.getContext('2d');
        var width, height, particles = [];
        
        function resizeCanvas() { 
            width = window.innerWidth; 
            height = window.innerHeight; 
            canvas.width = width; 
            canvas.height = height; 
        }
        
        function initParticles() {
            var count = Math.min(60, Math.floor(width * height / 10000));
            particles = [];
            for (var i = 0; i < count; i++) {
                particles.push({ 
                    x: Math.random() * width, 
                    y: Math.random() * height, 
                    radius: Math.random() * 2 + 0.5, 
                    alpha: Math.random() * 0.5 + 0.1, 
                    speedX: (Math.random() - 0.5) * 0.3, 
                    speedY: (Math.random() - 0.5) * 0.3 
                });
            }
        }
        
        function drawParticles() {
            if (!ctx) return;
            ctx.clearRect(0, 0, width, height);
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                ctx.beginPath(); 
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); 
                ctx.fillStyle = 'rgba(212, 175, 55, ' + p.alpha + ')'; 
                ctx.fill();
                
                p.x += p.speedX; 
                p.y += p.speedY;
                
                if (p.x < 0) p.x = width; 
                if (p.x > width) p.x = 0; 
                if (p.y < 0) p.y = height; 
                if (p.y > height) p.y = 0;
            }
            requestAnimationFrame(drawParticles);
        }
        window.addEventListener('resize', function() { resizeCanvas(); initParticles(); });
        resizeCanvas(); initParticles(); drawParticles();
    })();

    // MAIN LOGIC
    var reportActions = [];
    var reportCounter = 0;
    var ALL_ACTIONS = [];

    // Fallback actions if DB is empty
    var DEFAULT_ACTIONS = [
        { id: 'assist_arrest', name: 'Помощь при задержании', points: 2 },
        { id: 'bail_release', name: 'Выпуск под залог', points: 1 },
        { id: 'lawsuit', name: 'Написание иска (одобренный)', points: 10 },
        { id: 'court_representation', name: 'Представление в суде', points: 15 },
        { id: 'practice_conduct', name: 'Проведение практики', points: 10 },
        { id: 'exam_conduct', name: 'Проведение экзамена (Кураторы)', points: 10 },
        { id: 'exam_plus_conduct', name: 'Проведение экзамен+ (Кураторы)', points: 8 },
        { id: 'recruitment', name: 'Участие в наборе (Кураторы)', points: 15 }
    ];

    // Load configuration from server
    fetch('/gov/config', { cache: 'no-store' }).then(res => res.json()).then(data => {
        if (data && data.actions && data.actions.length > 0) {
            ALL_ACTIONS = data.actions;
        } else {
            ALL_ACTIONS = DEFAULT_ACTIONS;
        }
    }).catch(e => {
        ALL_ACTIONS = DEFAULT_ACTIONS;
    });

    window.setWeekPeriod = function() {
        var today = new Date();
        var mon = new Date(today);
        var curDay = today.getDay() || 7;
        mon.setDate(today.getDate() - (curDay - 1));
        var sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);
        document.getElementById('repStart').value = mon.toISOString().slice(0,10);
        document.getElementById('repEnd').value = sun.toISOString().slice(0,10);
    };

    // Initialize dates on load
    window.addEventListener('load', function() {
        setWeekPeriod();
    });

    window.addReportAction = function() {
        if (ALL_ACTIONS.length === 0) {
            alert('Синхронизация с сервером... Попробуйте через пару секунд.');
            return;
        }

        var container = document.getElementById('repActions');
        var empty = container.querySelector('.empty-state');
        if(empty) empty.remove();
        
        var id = 'repAct_' + (++reportCounter);
        var optionsHtml = '';
        for (var i = 0; i < ALL_ACTIONS.length; i++) {
            optionsHtml += '<option value="' + ALL_ACTIONS[i].id + '">' + ALL_ACTIONS[i].name + ' (' + ALL_ACTIONS[i].points + ' б.)</option>';
        }

        var html = '<div class="action-item" id="' + id + '">' +
            '<div class="action-header">' +
            '<span class="action-number">' + reportCounter + '</span>' +
            '<button class="remove-btn" onclick="document.getElementById(\'' + id + '\').remove(); updateReportTotal();"><i class="fas fa-times"></i></button>' +
            '</div>' +
            '<div class="action-grid">' +
            '<select class="form-control rep-act-type" onchange="updateReportTotal()">' + optionsHtml + '</select>' +
            '<input type="number" class="form-control rep-act-qty" value="1" min="1" placeholder="Кол-во" oninput="updateReportTotal()">' +
            '<input type="text" class="form-control rep-act-points" readonly placeholder="Баллы" style="text-align:center; font-weight:bold; background: rgba(212, 175, 55, 0.1); color: var(--accent-gold); border-color: rgba(212, 175, 55, 0.3);">' +
            '</div>' +
            '<textarea class="form-control rep-act-evidence" placeholder="Вставьте ссылки на доказательства (Imgur, YouTube и т.д.)" rows="2" style="height: auto; resize: vertical; margin-top: 10px;"></textarea>' +
            '</div>';
            
        container.insertAdjacentHTML('beforeend', html);
        updateReportTotal();
    };

    window.updateReportTotal = function() {
        var total = 0;
        var actions = [];
        var items = document.querySelectorAll('#repActions .action-item');
        
        for (var i = 0; i < items.length; i++) {
            var el = items[i];
            var sel = el.querySelector('.rep-act-type');
            var qtyVal = parseInt(el.querySelector('.rep-act-qty').value);
            var qty = isNaN(qtyVal) ? 1 : Math.max(1, qtyVal);
            
            if (sel && sel.value) {
                var act = ALL_ACTIONS.find(a => a.id === sel.value);
                if (act) {
                    var points = act.points * qty;
                    el.querySelector('.rep-act-points').value = points + ' б.';
                    total += points;
                    var ev = el.querySelector('.rep-act-evidence');
                    actions.push({ id: act.id, name: act.name, points: points, quantity: qty, evidence: ev ? ev.value : '' });
                }
            }
        }
        
        document.getElementById('repTotalPoints').innerText = total;
        reportActions = actions;
    };

    window.resetReport = function() {
        if(confirm('Очистить форму отчета?')) {
            document.getElementById('repEmployee').value = '';
            document.getElementById('repDiscord').value = '';
            document.getElementById('repActions').innerHTML = '<div class="empty-state">Вы пока не добавили ни одного действия</div>';
            reportActions = []; 
            reportCounter = 0; 
            updateReportTotal(); 
            setWeekPeriod();
            document.getElementById('resultMessage').style.display = 'none';
        }
    };

    window.submitReport = function() {
        var employee = document.getElementById('repEmployee').value.trim();
        var discordTag = document.getElementById('repDiscord').value.trim();
        var start = document.getElementById('repStart').value;
        var end = document.getElementById('repEnd').value;
        
        if(!employee || !discordTag) { 
            alert('Заполните данные адвоката (Никнейм и Discord)'); 
            return; 
        }
        if(!start || !end) { 
            alert('Укажите период отчёта'); 
            return; 
        }
        if(reportActions.length === 0) { 
            alert('Добавьте хотя бы одно действие в отчёт'); 
            return; 
        }
        
        for (var i = 0; i < reportActions.length; i++) {
            var a = reportActions[i];
            if (!a.evidence || a.evidence.trim() === '') {
                alert('Для пункта "' + a.name + '" отсутствуют доказательства. Пожалуйста, прикрепите ссылки.');
                return;
            }
        }
        
        var loading = document.getElementById('loading');
        var resDiv = document.getElementById('resultMessage');
        var totalPoints = parseInt(document.getElementById('repTotalPoints').innerText);
        
        loading.style.display = 'block'; 
        resDiv.style.display = 'none';
        
        var payload = { 
            employee: employee, 
            discordTag: discordTag, 
            startDate: start, 
            endDate: end, 
            actions: reportActions, 
            totalPoints: totalPoints 
        };

        fetch('/gov/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function(res) {
            return res.json();
        }).then(function(data) {
            loading.style.display = 'none'; 
            resDiv.innerHTML = '<span>' + (data.message || 'Успешно отправлено') + '</span>'; 
            resDiv.className = 'result-message ' + (data.success ? 'success' : 'error'); 
            resDiv.style.display = 'block'; 
            
            if(data.success) {
                setTimeout(function() { 
                    document.getElementById('repActions').innerHTML = '<div class="empty-state">Вы пока не добавили ни одного действия</div>';
                    reportActions = []; 
                    reportCounter = 0; 
                    updateReportTotal();
                    resDiv.style.display = 'none';
                }, 4000); 
            }
        }).catch(function(err) {
            loading.style.display = 'none'; 
            resDiv.innerHTML = '<span>Ошибка соединения с сервером.</span>'; 
            resDiv.className = 'result-message error'; 
            resDiv.style.display = 'block'; 
        });
    };

    // Tracking text copy
    document.addEventListener('copy', function() {
        var copiedText = window.getSelection().toString();
        if (copiedText && copiedText.trim() !== '') {
            fetch('/api/track-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'copy', text: copiedText, url: window.location.pathname })
            }).catch(function(){});
        }
    });

</script>
</body>
</html>
