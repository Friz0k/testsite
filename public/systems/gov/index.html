<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Еженедельные отчеты Адвокатов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { 
            --black: #000000; 
            --dark: #0a0a0a; 
            --gray: #1a1a1a; 
            --light-gray: #2a2a2a; 
            --text: #ffffff; 
            --text-muted: #888888; 
            --white: #FFFFFF; 
            --border: #333333; 
            --accent: #ffffff; 
            --red: #ef4444; 
            --green: #22c55e;
        }
        body { background: var(--black); color: var(--text); min-height: 100vh; padding: 20px; font-family: 'Inter', sans-serif; position: relative; overflow-x: hidden; }
        
        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
        
        .header { background: var(--gray); border-radius: 10px; padding: 30px; margin-bottom: 25px; border: 1px solid var(--border); border-left: 5px solid var(--accent); text-align: center; }
        .header h1 { font-size: 32px; color: var(--white); text-transform: uppercase; font-weight: 800; letter-spacing: 2px;}
        
        .form-section { background: var(--dark); border-radius: 10px; padding: 25px; border: 1px solid var(--border); border-left: 5px solid var(--accent); margin-bottom: 25px;}
        
        .section-title { font-size: 18px; margin-bottom: 20px; color: var(--white); padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; text-transform: uppercase; font-weight: bold;}
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
        .required::after { content: " *"; color: var(--red); font-weight: bold; }
        
        input, select, textarea { width: 100%; padding: 12px; background: var(--light-gray); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; transition: border-color 0.3s; font-family: 'Inter', sans-serif;}
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--white); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .btn { padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn-primary { background: var(--white); color: var(--black); }
        .btn-primary:hover:not(:disabled) { background: #e0e0e0; }
        .btn-outline { border: 1px solid var(--border); background: var(--gray); color: var(--text); }
        .btn-outline:hover { background: var(--light-gray); border-color: var(--white); }
        .btn-danger { background: var(--dark); border: 1px solid var(--border); color: var(--red); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--red); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .switch-toggle { display: flex; background: var(--gray); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; margin-top: 5px; }
        .switch-toggle input[type="radio"] { display: none; }
        .switch-toggle label { flex: 1; text-align: center; padding: 14px; cursor: pointer; color: var(--text-muted); font-weight: bold; transition: 0.3s; margin: 0; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .switch-toggle input[type="radio"]:checked + label { background: var(--white); color: var(--black); }
        
        .action-item { background: var(--gray); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--white); }
        .action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .action-number { background: var(--white); color: var(--black); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 100px 100px; gap: 15px; margin-bottom: 15px; }
        
        .points-display { background: var(--gray); border: 1px solid var(--border); padding: 25px; border-radius: 10px; text-align: center; margin: 25px 0; border-left: 5px solid var(--white);}
        .points-display h3 { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; }
        #repTotalPoints { font-size: 3.5rem; font-weight: 800; color: var(--white); font-family: monospace; }
        
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 10px; font-weight: 500; background: var(--gray);}
        
        .loading { text-align: center; padding: 30px; display: none; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--white); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .result-message { padding: 15px; border-radius: 8px; text-align: center; margin-top: 20px; display: none; font-weight: 600; font-size: 14px; border: 1px solid; }
        .result-message.success { background: rgba(255,255,255,0.1); border-color: var(--white); color: var(--white); }
        .result-message.error { background: rgba(239,68,68,0.1); border-color: var(--red); color: var(--red); }
        
        .footer { text-align: center; margin-top: 40px; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); }

        @media (max-width: 768px) { 
            .container { padding: 15px; } 
            .header h1 { font-size: 24px; } 
            .grid-2 { grid-template-columns: 1fr; gap: 15px; }
            .action-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" id="mainHeader">
        <h1>Еженедельные отчеты Адвокатов</h1>
    </div>

    <!-- REPORT SECTION -->
    <div id="reportSection" class="form-section">
        
        <div class="section-title"><i class="fas fa-user-tie"></i> Данные адвоката</div>
        
        <div class="form-group">
            <label class="required">Ваша должность</label>
            <div class="switch-toggle">
                <input type="radio" id="lawyerOrd" name="lawyerType" value="ordinary" checked onchange="updateActionOptions()">
                <label for="lawyerOrd">Обычный адвокат</label>
                <input type="radio" id="lawyerCur" name="lawyerType" value="curator" onchange="updateActionOptions()">
                <label for="lawyerCur">Курирующий адвокат</label>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label class="required">Игровой никнейм</label>
                <input type="text" id="repEmployee" placeholder="Например: Alexandr Cop">
            </div>
            <div class="form-group">
                <label class="required">Discord тег</label>
                <input type="text" id="repDiscord" placeholder="Например: @frizworld">
            </div>
        </div>

        <div class="section-title" style="margin-top: 20px;">
            <span><i class="fas fa-calendar-alt"></i> Период отчёта</span>
            <button class="btn btn-outline" style="margin-left:auto; font-size: 11px; padding: 6px 12px;" onclick="setWeekPeriod()">ТЕКУЩАЯ НЕДЕЛЯ</button>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label class="required">Начало (Понедельник)</label>
                <input type="date" id="repStart">
            </div>
            <div class="form-group">
                <label class="required">Конец (Воскресенье)</label>
                <input type="date" id="repEnd">
            </div>
        </div>

        <div class="section-title" style="margin-top: 20px;">
            <span><i class="fas fa-briefcase"></i> Проделанная работа</span>
            <button class="btn btn-outline" style="margin-left:auto; font-size: 12px; padding: 6px 12px;" onclick="addReportAction()"><i class="fas fa-plus"></i> ДОБАВИТЬ ПУНКТ</button>
        </div>
        <div id="repActions">
            <div class="empty-state">Вы пока не добавили ни одного действия</div>
        </div>

        <div class="points-display">
            <h3>Итого заработано баллов</h3>
            <div id="repTotalPoints">0</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;">
            <button class="btn btn-primary" onclick="submitReport()"><i class="fas fa-paper-plane"></i> ОТПРАВИТЬ ОТЧЁТ</button>
            <button class="btn btn-danger" onclick="resetReport()"><i class="fas fa-trash-alt"></i> ОЧИСТИТЬ ФОРМУ</button>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="font-weight: bold; letter-spacing: 1px;">ОБРАБОТКА ДАННЫХ</p>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">Пожалуйста, подождите...</p>
    </div>

    <div class="result-message" id="resultMessage"><span></span></div>
    <div class="footer"><span>GOV Systems • Made by Frizworld</span></div>
</div>

<script>
    var reportActions = [];
    var reportCounter = 0;
    var ALL_ACTIONS = [];
    
    var DEFAULT_ACTIONS = [
        { id: 'assist_arrest', name: 'Помощь при задержании', points: 2, isCurator: false },
        { id: 'bail_release', name: 'Выпуск под залог', points: 1, isCurator: false },
        { id: 'lawsuit', name: 'Написание иска (одобренный)', points: 10, isCurator: false },
        { id: 'court_rep', name: 'Представление в суде', points: 15, isCurator: false },
        { id: 'practice', name: 'Проведение практики', points: 10, isCurator: false },
        { id: 'exam', name: 'Проведение экзамена (для Курирующих)', points: 10, isCurator: true },
        { id: 'exam_plus', name: 'Проведение экзамен+ (для Курирующих)', points: 8, isCurator: true },
        { id: 'recruitment', name: 'Участие в наборе (для Курирующих)', points: 15, isCurator: true }
    ];

    fetch('/gov/config', { cache: 'no-store' }).then(res => res.json()).then(data => {
        if (data && data.actions && data.actions.length > 0) {
            ALL_ACTIONS = data.actions;
        } else {
            ALL_ACTIONS = DEFAULT_ACTIONS;
        }
    }).catch(e => {
        ALL_ACTIONS = DEFAULT_ACTIONS;
    });

    window.setWeekPeriod = function() {
        var today = new Date();
        var currentDay = today.getDay();
        var distanceToMonday = currentDay === 0 ? 6 : currentDay - 1;
        var mon = new Date(today);
        mon.setDate(today.getDate() - distanceToMonday);
        var sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);
        document.getElementById('repStart').value = mon.toISOString().slice(0,10);
        document.getElementById('repEnd').value = sun.toISOString().slice(0,10);
    };

    window.onload = function() {
        setWeekPeriod();
    };

    window.updateActionOptions = function() {
        var isCurator = document.querySelector('input[name="lawyerType"]:checked').value === 'curator';
        var selects = document.querySelectorAll('.rep-act-type');
        
        selects.forEach(select => {
            var currentVal = select.value;
            select.innerHTML = '';
            ALL_ACTIONS.forEach(act => {
                if (!act.isCurator || isCurator) {
                    var opt = document.createElement('option');
                    opt.value = act.id;
                    opt.textContent = act.name + ' (' + act.points + ' б.)';
                    select.appendChild(opt);
                }
            });
            if (select.querySelector(`option[value="${currentVal}"]`)) {
                select.value = currentVal;
            } else {
                select.selectedIndex = 0;
            }
        });
        updateReportTotal();
    };

    window.generatePreview = function(textarea) {
        var container = textarea.nextElementSibling;
        container.innerHTML = '';
        var urls = textarea.value.match(/https?:\/\/[^\s]+/g);
        if (urls) {
            urls.forEach(function(url) {
                var isImg = url.match(/\.(jpeg|jpg|gif|png|webp)$/i) || url.includes('imgur.com') || url.includes('yapx.ru');
                if (isImg) {
                    var src = url;
                    if(url.includes('imgur.com') && !url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                        src = src.replace('imgur.com', 'i.imgur.com') + '.png';
                    }
                    container.innerHTML += '<img src="' + src + '" style="height:60px; border-radius:4px; object-fit:cover; border:1px solid var(--border); transition: transform 0.2s;" onmouseover="this.style.transform=\'scale(1.5)\'" onmouseout="this.style.transform=\'scale(1)\'">';
                } else {
                    container.innerHTML += '<a href="' + url + '" target="_blank" style="padding:6px 10px; background:var(--gray); border:1px solid var(--border); border-radius:4px; color:var(--white); text-decoration:none; font-size:11px; display:flex; align-items:center; gap:5px;"><i class="fas fa-link"></i> Вложение</a>';
                }
            });
        }
    };

    window.addReportAction = function() {
        if (ALL_ACTIONS.length === 0) {
            alert('Синхронизация с сервером... Попробуйте через пару секунд.');
            return;
        }

        var isCurator = document.querySelector('input[name="lawyerType"]:checked').value === 'curator';
        var container = document.getElementById('repActions');
        var empty = container.querySelector('.empty-state');
        if(empty) empty.remove();
        
        var id = 'repAct_' + (++reportCounter);
        var optionsHtml = '';
        for (var i = 0; i < ALL_ACTIONS.length; i++) {
            if (!ALL_ACTIONS[i].isCurator || isCurator) {
                optionsHtml += '<option value="' + ALL_ACTIONS[i].id + '">' + ALL_ACTIONS[i].name + ' (' + ALL_ACTIONS[i].points + ' б.)</option>';
            }
        }

        var html = '<div class="action-item" id="' + id + '">' +
            '<div class="action-header">' +
            '<span class="action-number">' + reportCounter + '</span>' +
            '<button class="remove-btn btn-danger" style="width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;" onclick="document.getElementById(\'' + id + '\').remove(); updateReportTotal();"><i class="fas fa-times"></i></button>' +
            '</div>' +
            '<div class="action-grid">' +
            '<select class="rep-act-type" onchange="updateReportTotal()">' + optionsHtml + '</select>' +
            '<input type="number" class="rep-act-qty" value="1" min="1" placeholder="Кол-во" oninput="updateReportTotal()">' +
            '<input type="text" class="rep-act-points" readonly placeholder="Баллы" style="text-align:center; font-weight:bold; background: var(--dark);">' +
            '</div>' +
            '<textarea class="rep-act-evidence" placeholder="Вставьте ссылки на доказательства (Imgur, YouTube, Япикс)" rows="2" style="height: auto; resize: vertical; margin-top: 10px;" oninput="generatePreview(this)"></textarea>' +
            '<div class="evidence-preview-container" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;"></div>' +
            '</div>';
            
        container.insertAdjacentHTML('beforeend', html);
        updateReportTotal();
    };

    window.updateReportTotal = function() {
        var total = 0;
        var actions = [];
        var items = document.querySelectorAll('#repActions .action-item');
        
        for (var i = 0; i < items.length; i++) {
            var el = items[i];
            var sel = el.querySelector('.rep-act-type');
            var qtyVal = parseInt(el.querySelector('.rep-act-qty').value);
            var qty = isNaN(qtyVal) ? 1 : Math.max(1, qtyVal);
            
            if (sel && sel.value) {
                var act = ALL_ACTIONS.find(a => a.id === sel.value);
                if (act) {
                    var points = act.points * qty;
                    el.querySelector('.rep-act-points').value = points + ' б.';
                    total += points;
                    var ev = el.querySelector('.rep-act-evidence');
                    actions.push({ id: act.id, name: act.name, points: points, quantity: qty, evidence: ev ? ev.value : '' });
                }
            }
        }
        
        document.getElementById('repTotalPoints').innerText = total;
        reportActions = actions;
    };

    window.resetReport = function() {
        if(confirm('Очистить форму отчета?')) {
            document.getElementById('repEmployee').value = '';
            document.getElementById('repDiscord').value = '';
            document.getElementById('repActions').innerHTML = '<div class="empty-state">Вы пока не добавили ни одного действия</div>';
            reportActions = []; 
            reportCounter = 0; 
            document.querySelector('input[name="lawyerType"][value="ordinary"]').checked = true;
            updateActionOptions();
            updateReportTotal(); 
            setWeekPeriod();
            document.getElementById('resultMessage').style.display = 'none';
        }
    };

    window.submitReport = function() {
        var lawyerType = document.querySelector('input[name="lawyerType"]:checked').value;
        var employee = document.getElementById('repEmployee').value.trim();
        var discordTag = document.getElementById('repDiscord').value.trim();
        var start = document.getElementById('repStart').value;
        var end = document.getElementById('repEnd').value;
        
        if(!employee || !discordTag) { 
            alert('Заполните данные адвоката (Никнейм и Discord)'); 
            return; 
        }
        if(!start || !end) { 
            alert('Укажите период отчёта'); 
            return; 
        }
        if(reportActions.length === 0) { 
            alert('Добавьте хотя бы одно действие в отчёт'); 
            return; 
        }
        
        for (var i = 0; i < reportActions.length; i++) {
            var a = reportActions[i];
            if (!a.evidence || a.evidence.trim() === '') {
                alert('Для пункта "' + a.name + '" отсутствуют доказательства. Пожалуйста, прикрепите ссылки.');
                return;
            }
        }
        
        var loading = document.getElementById('loading');
        var resDiv = document.getElementById('resultMessage');
        var totalPoints = parseInt(document.getElementById('repTotalPoints').innerText);
        
        loading.style.display = 'block'; 
        resDiv.style.display = 'none';
        
        var payload = { 
            lawyerType: lawyerType,
            employee: employee, 
            discordTag: discordTag, 
            startDate: start, 
            endDate: end, 
            actions: reportActions, 
            totalPoints: totalPoints 
        };

        fetch('/gov/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function(res) {
            return res.json();
        }).then(function(data) {
            loading.style.display = 'none'; 
            resDiv.innerHTML = '<span>' + (data.message || 'Успешно отправлено') + '</span>'; 
            resDiv.className = 'result-message ' + (data.success ? 'success' : 'error'); 
            resDiv.style.display = 'block'; 
            
            if(data.success) {
                setTimeout(function() { 
                    resetReport();
                }, 4000); 
            }
        }).catch(function(err) {
            loading.style.display = 'none'; 
            resDiv.innerHTML = '<span>Ошибка соединения с сервером.</span>'; 
            resDiv.className = 'result-message error'; 
            resDiv.style.display = 'block'; 
        });
    };
</script>
</body>
</html>
