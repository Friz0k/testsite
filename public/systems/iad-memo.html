<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Памятка IAD | LSPD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #070709;
            --card-bg: #110e11;
            --primary-red: #dc2626;
            --dark-red: #7f1d1d;
            --border-color: #3f1515;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --glow: rgba(220, 38, 38, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-red) var(--card-bg);
        }

        ::-webkit-scrollbar { 
            width: 8px; 
        }

        ::-webkit-scrollbar-track { 
            background: var(--card-bg); 
        }

        ::-webkit-scrollbar-thumb { 
            background: var(--dark-red); 
            border-radius: 4px; 
        }

        ::-webkit-scrollbar-thumb:hover { 
            background: var(--primary-red); 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            background-image: radial-gradient(circle at top center, rgba(127, 29, 29, 0.15) 0%, transparent 60%);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 2px solid var(--border-color);
            background: linear-gradient(180deg, rgba(20, 10, 10, 0.9) 0%, transparent 100%);
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .logo-icon {
            font-size: 50px;
            color: var(--primary-red);
            filter: drop-shadow(0 0 10px var(--glow));
        }

        h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #ff9999);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--primary-red);
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .cluster-container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .card-full-width {
            grid-column: 1 / -1;
        }

        .card-double-height {
            grid-row: span 2;
            height: 100%;
            min-height: 560px;
            display: flex;
            flex-direction: column;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 3px;
            background: var(--primary-red);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--dark-red);
            box-shadow: 0 10px 25px var(--glow);
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary-red);
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            text-transform: uppercase;
        }

        .card h2 i {
            font-size: 24px;
        }

        .content-text {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .list-items {
            list-style: none;
        }

        .list-items li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .list-items li::before {
            content: '►';
            position: absolute;
            left: 0;
            top: 2px;
            color: var(--primary-red);
            font-size: 10px;
        }

        .punishment-item {
            background: rgba(220, 38, 38, 0.05);
            border-left: 3px solid var(--primary-red);
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }

        .punishment-item h4 {
            color: #fff;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .punishment-item p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .forbidden-badge {
            display: inline-block;
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid var(--primary-red);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .scrollable-list {
            overflow-y: auto;
            padding-right: 10px;
            margin-top: 10px;
            max-height: 250px;
        }

        .scrollable-list-fixed {
            overflow-y: auto;
            padding-right: 10px;
            margin-top: 10px;
            flex: 1; 
            min-height: 0; 
        }

        .violation-tag {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .violation-code {
            color: var(--primary-red);
            font-weight: bold;
        }

        .warning-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid #f59e0b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            color: #fcd34d;
            font-size: 13px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .tutorials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .tutorial-card {
            background: #151515;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .tutorial-card:hover {
            border-color: var(--primary-red);
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.15);
        }

        .tutorial-media-preview {
            height: 160px;
            background: #09090b;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .tutorial-media-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .tutorial-media-preview:hover img {
            opacity: 1;
        }

        .tutorial-play-icon {
            position: absolute;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: transform 0.2s;
            pointer-events: none;
        }

        .tutorial-media-preview:hover .tutorial-play-icon {
            transform: scale(1.2);
            color: #fff;
        }

        .tutorial-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .tutorial-info h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .tutorial-info p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
            flex-grow: 1;
        }

        .legis-item {
            background: #151515;
            border-left: 3px solid var(--primary-red);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 0 8px 8px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .legis-title {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }

        .legis-btn {
            background: #27272a;
            color: #fff;
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #3f3f46;
            transition: all 0.2s;
        }

        .legis-btn:hover {
            background: var(--primary-red);
            border-color: var(--primary-red);
        }

        .legis-desc {
            color: var(--text-muted);
            font-size: 13px;
        }

        .parking-img-box {
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .parking-img-box:hover {
            transform: scale(1.02);
            border-color: var(--primary-red);
        }

        .parking-img-box img {
            width: 100%;
            display: block;
        }

        .media-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        .media-modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-width: 900px;
            width: 90%;
            padding: 20px;
            position: relative;
            text-align: center;
        }

        .media-close {
            position: absolute;
            top: -15px;
            right: -15px;
            background: var(--primary-red);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.3s;
        }

        .media-close:hover {
            background: var(--dark-red);
        }

        .media-desc {
            margin-top: 15px;
            color: var(--text-main);
            font-size: 15px;
            text-align: left;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-red);
        }

        @media (max-width: 768px) {
            .cluster-container { 
                grid-template-columns: 1fr; 
            }
            .card-double-height {
                grid-row: auto;
                min-height: auto;
                height: 500px; 
            }
            header { padding: 20px 10px; }
            h1 { font-size: 28px; }
            .logo-icon { font-size: 35px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <i class="fas fa-balance-scale logo-icon"></i>
            <div>
                <h1 id="memoTitle">IAD</h1>
            </div>
        </div>
        <div class="subtitle" id="memoSubtitle">Загрузка данных...</div>
    </header>

    <div class="cluster-container" id="clusterGrid"></div>

    <div id="mediaModal" class="media-modal">
        <div class="media-modal-content">
            <span class="media-close" onclick="closeMediaModal()">&times;</span>
            <div id="mediaContainer"></div>
            <div id="mediaDescription" class="media-desc"></div>
        </div>
    </div>

    <script>
        var defaultData = {
            header: { 
                title: "Памятка IAD", 
                subtitle: "ЧЕСТНОСТЬ. КОНТРОЛЬ. СПРАВЕДЛИВОСТЬ." 
            },
            info: { what_is_iad: "Данные не заполнены. Обратитесь к руководству." }, rights: [], tasks: [], requirements: [], how_to_issue: [], punishments: [],
            forbidden_departments: [], activities: "", parking: [], parking_image: "", violations: [], recertification: [], 
            tutorials: [], macros: [], legislation: []
        };

        function loadData() {
            var nocache = new Date().getTime();
            
            var debugLog = document.createElement('div');
            debugLog.style.position = 'fixed';
            debugLog.style.bottom = '15px';
            debugLog.style.left = '15px';
            debugLog.style.background = 'rgba(10,10,15,0.95)';
            debugLog.style.color = '#38bdf8';
            debugLog.style.padding = '15px';
            debugLog.style.border = '1px solid #38bdf8';
            debugLog.style.borderRadius = '8px';
            debugLog.style.zIndex = '999999';
            debugLog.style.fontFamily = 'monospace';
            debugLog.style.fontSize = '12px';
            debugLog.style.maxWidth = '400px';
            debugLog.style.boxShadow = '0 0 20px rgba(0,0,0,0.8)';
            debugLog.innerHTML = '<b style="color:#fff;">ОТЛАДКА ЗАГРУЗКИ IAD:</b><br>> Поиск базы данных...<br>';
            document.body.appendChild(debugLog);

            return fetch('/iad_data.json?v=' + nocache, {
                method: 'GET',
                cache: 'no-store',
                headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache',
                    'Expires': '0'
                }
            })
            .then(function(res) {
                debugLog.innerHTML += '> HTTP Статус корня: ' + res.status + '<br>';
                if (!res.ok) {
                    debugLog.innerHTML += '> <span style="color:#ef4444">Ошибка прямого доступа. Пробуем обойти через API...</span><br>';
                    return fetch('/api/file?path=iad_data.json&v=' + nocache).then(function(apiRes) {
                        debugLog.innerHTML += '> API Статус: ' + apiRes.status + '<br>';
                        if(apiRes.status === 401 || apiRes.status === 403) {
                            debugLog.innerHTML += '> <span style="color:#ef4444">API Отклонено: Нет прав (Пользователь не авторизован в админке)</span><br>';
                        }
                        return apiRes.json();
                    });
                }
                return res.json();
            })
            .then(function(data) {
                debugLog.innerHTML += '> Обработка JSON...<br>';
                if (data && data.content) {
                    debugLog.innerHTML += '> База загружена через API.<br>';
                    try { 
                        var parsed = JSON.parse(data.content); 
                        debugLog.innerHTML += '> <span style="color:#22c55e; font-weight:bold;">УСПЕХ! Окно закроется.</span>';
                        setTimeout(function(){ debugLog.remove(); }, 5000);
                        return parsed;
                    } catch(e) { 
                        debugLog.innerHTML += '> <span style="color:#ef4444">Синтаксическая ошибка в базе. Загружен шаблон.</span><br>';
                        return defaultData; 
                    }
                }
                if (data && data.header) {
                    debugLog.innerHTML += '> База загружена напрямую.<br>';
                    debugLog.innerHTML += '> <span style="color:#22c55e; font-weight:bold;">УСПЕХ! Окно закроется.</span>';
                    setTimeout(function(){ debugLog.remove(); }, 5000);
                    return data;
                }
                debugLog.innerHTML += '> <span style="color:#ef4444">База пуста или повреждена. Загружен шаблон.</span><br>';
                return defaultData;
            })
            .catch(function(err) {
                debugLog.innerHTML += '> <span style="color:#ef4444">КРИТИЧЕСКАЯ ОШИБКА: ' + err.message + '</span><br>';
                return defaultData;
            });
        }

        function renderMemo() {
            loadData().then(function(data) {
                var grid = document.getElementById('clusterGrid');

                document.getElementById('memoTitle').innerText = (data.header && data.header.title) ? data.header.title : 'IAD';
                document.getElementById('memoSubtitle').innerText = (data.header && data.header.subtitle) ? data.header.subtitle : '';

                var html = '<div class="card">' +
                    '<h2><i class="fas fa-shield-alt"></i> Что такое IAD?</h2>' +
                    '<div class="content-text">' + ((data.info && data.info.what_is_iad) ? data.info.what_is_iad : '') + '</div>' +
                    '</div>';

                if (data.tasks && data.tasks.length > 0) {
                    html += '<div class="card">' +
                        '<h2><i class="fas fa-crosshairs"></i> Задачи отдела</h2>' +
                        '<ul class="list-items">';
                    for (var i = 0; i < data.tasks.length; i++) {
                        html += '<li>' + data.tasks[i] + '</li>';
                    }
                    html += '</ul></div>';
                }

                if (data.requirements && data.requirements.length > 0) {
                    html += '<div class="card">' +
                        '<h2><i class="fas fa-user-tie"></i> Требования к сотруднику</h2>' +
                        '<ul class="list-items">';
                    for (var j = 0; j < data.requirements.length; j++) {
                        html += '<li>' + data.requirements[j] + '</li>';
                    }
                    html += '</ul></div>';
                }

                if (data.rights && data.rights.length > 0) {
                    html += '<div class="card">' +
                        '<h2><i class="fas fa-gavel"></i> Права сотрудников IAD</h2>' +
                        '<ul class="list-items">';
                    for (var k = 0; k < data.rights.length; k++) {
                        html += '<li>' + data.rights[k] + '</li>';
                    }
                    html += '</ul></div>';
                }

                if (data.punishments && data.punishments.length > 0) {
                    html += '<div class="card">' +
                        '<h2><i class="fas fa-clipboard-list"></i> Виды взысканий</h2>' +
                        '<div class="scrollable-list">';
                    for (var p = 0; p < data.punishments.length; p++) {
                        var pun = data.punishments[p];
                        html += '<div class="punishment-item">' +
                            '<h4>' + (pun.title ? pun.title : '') + '</h4>' +
                            '<p>' + (pun.desc ? pun.desc : '') + '</p>' +
                            '</div>';
                    }
                    html += '</div></div>';
                }

                if (data.how_to_issue && data.how_to_issue.length > 0) {
                    html += '<div class="card">' +
                        '<h2><i class="fas fa-file-signature"></i> Как выдать взыскание</h2>' +
                        '<ul class="list-items">';
                    for (var h = 0; h < data.how_to_issue.length; h++) {
                        html += '<li>' + data.how_to_issue[h] + '</li>';
                    }
                    html += '</ul>' +
                        '<div class="warning-box">' +
                        '<i class="fas fa-exclamation-triangle"></i>' +
                        '<div><b>Примечание:</b> Храните доказательства 72 часа. При их отсутствии вы подлежите ответственности.</div>' +
                        '</div></div>';
                }

                if ((data.forbidden_departments && data.forbidden_departments.length > 0) || (data.parking && data.parking.length > 0)) {
                    html += '<div class="card">';
                    if (data.forbidden_departments && data.forbidden_departments.length > 0) {
                        html += '<h2><i class="fas fa-ban"></i> Запрет на взыскания</h2>' +
                            '<div style="margin-bottom: 20px;">';
                        for (var f = 0; f < data.forbidden_departments.length; f++) {
                            html += '<span class="forbidden-badge"><i class="fas fa-times"></i> ' + data.forbidden_departments[f] + '</span>';
                        }
                        html += '</div>';
                    }
                    if (data.parking && data.parking.length > 0) {
                        html += '<h2><i class="fas fa-parking"></i> Парковка LSPD</h2>' +
                            '<ul class="list-items">';
                        for (var pa = 0; pa < data.parking.length; pa++) {
                            html += '<li>' + data.parking[pa] + '</li>';
                        }
                        html += '</ul>';
                    }
                    if (data.parking_image && data.parking_image.trim() !== '') {
                        html += '<div class="parking-img-box" onclick="openMediaModal(\'image\', \'' + data.parking_image + '\', \'Зоны парковки LSPD\')">' +
                            '<img src="' + data.parking_image + '" alt="Парковка">' +
                            '</div>';
                    }
                    html += '</div>';
                }

                if (data.violations && data.violations.length > 0) {
                    html += '<div class="card card-double-height">' +
                        '<h2><i class="fas fa-exclamation-circle"></i> Нарушения устава</h2>' +
                        '<div class="scrollable-list-fixed">';
                    for (var v = 0; v < data.violations.length; v++) {
                        var parts = data.violations[v].split('|');
                        html += '<div class="violation-tag">' +
                            '<span style="flex-grow: 1; padding-right: 10px;">' + (parts[0] ? parts[0].trim() : '') + '</span>' +
                            '<span class="violation-code">' + (parts.length > 1 ? parts[1].trim() : '') + '</span>' +
                            '</div>';
                    }
                    html += '</div></div>';
                }

                if (data.legislation && data.legislation.length > 0) {
                    html += '<div class="card card-double-height">' +
                        '<h2><i class="fas fa-balance-scale-right"></i> Законодательная база</h2>' +
                        '<div class="scrollable-list-fixed">';
                    for (var l = 0; l < data.legislation.length; l++) {
                        var leg = data.legislation[l];
                        html += '<div class="legis-item">' +
                            '<div class="legis-header">' +
                            '<span class="legis-title">' + (leg.title ? leg.title : '') + '</span>' +
                            (leg.url ? '<a href="' + leg.url + '" target="_blank" class="legis-btn">Читать</a>' : '') +
                            '</div>' +
                            (leg.desc ? '<div class="legis-desc">' + leg.desc + '</div>' : '') +
                            '</div>';
                    }
                    html += '</div></div>';
                }

                if (data.recertification && data.recertification.length > 0) {
                    html += '<div class="card">' +
                        '<h2><i class="fas fa-clipboard-question"></i> Вопросы переаттестации</h2>' +
                        '<div class="scrollable-list">' +
                        '<ul class="list-items">';
                    for (var r = 0; r < data.recertification.length; r++) {
                        html += '<li>' + data.recertification[r] + '</li>';
                    }
                    html += '</ul></div></div>';
                }

                if ((data.tutorials && data.tutorials.length > 0) || (data.macros && data.macros.length > 0)) {
                    html += '<div class="card card-full-width">';
                    
                    if (data.macros && data.macros.length > 0) {
                        html += '<h2><i class="fas fa-keyboard"></i> Макросы и Биндеры</h2>' +
                            '<div class="tutorials-grid" style="margin-bottom: 40px;">';
                        for (var m = 0; m < data.macros.length; m++) {
                            var mac = data.macros[m];
                            html += '<div class="tutorial-card" style="padding: 15px;">' +
                                '<h3 style="color: #fff; font-size: 16px; margin-bottom: 8px;">' + (mac.title ? mac.title : '') + '</h3>' +
                                '<div style="background: #09090b; border: 1px solid #3f1515; padding: 12px; border-radius: 8px; color: #f3f4f6; font-family: monospace; font-size: 13px; white-space: pre-wrap; margin-bottom: 10px;">' + (mac.text ? mac.text : '') + '</div>' +
                                '</div>';
                        }
                        html += '</div>';
                    }

                    if (data.tutorials && data.tutorials.length > 0) {
                        html += '<h2><i class="fas fa-graduation-cap"></i> Обучающие материалы</h2>' +
                            '<div class="tutorials-grid">';
                        for (var t = 0; t < data.tutorials.length; t++) {
                            var tut = data.tutorials[t];
                            var mediaPreview = '';
                            if (tut.mediaType === 'video') {
                                mediaPreview = '<div class="tutorial-media-preview" onclick="openMediaModal(\'video\', \'' + tut.mediaUrl + '\', \'' + tut.mediaDesc + '\')">' +
                                    '<i class="fas fa-play-circle tutorial-play-icon"></i>' +
                                    '</div>';
                            } else if (tut.mediaType === 'image') {
                                mediaPreview = '<div class="tutorial-media-preview" onclick="openMediaModal(\'image\', \'' + tut.mediaUrl + '\', \'' + tut.mediaDesc + '\')">' +
                                    '<img src="' + tut.mediaUrl + '" alt="Превью">' +
                                    '<i class="fas fa-search-plus tutorial-play-icon" style="font-size: 30px;"></i>' +
                                    '</div>';
                            } else {
                                mediaPreview = '<div class="tutorial-media-preview" style="background: #110e11; cursor: default;">' +
                                    '<i class="fas fa-book-open" style="font-size: 40px; color: #3f1515;"></i>' +
                                    '</div>';
                            }

                            html += '<div class="tutorial-card">' +
                                mediaPreview +
                                '<div class="tutorial-info">' +
                                '<h3>' + (tut.title ? tut.title : '') + '</h3>' +
                                '<p>' + (tut.text ? tut.text : '') + '</p>' +
                                '</div></div>';
                        }
                        html += '</div>';
                    }
                    html += '</div>';
                }

                grid.innerHTML = html;
            });
        }

        function openMediaModal(type, url, desc) {
            var container = document.getElementById('mediaContainer');
            var descContainer = document.getElementById('mediaDescription');
            
            container.innerHTML = '';
            
            if (type === 'video') {
                container.innerHTML = '<video src="' + url + '" controls autoplay style="width: 100%; border-radius: 8px; max-height: 70vh;">Ваш браузер не поддерживает видео.</video>';
            } else if (type === 'image') {
                container.innerHTML = '<img src="' + url + '" style="width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px;">';
            }

            if (desc && desc.trim() !== '') {
                descContainer.innerHTML = desc;
                descContainer.style.display = 'block';
            } else {
                descContainer.style.display = 'none';
            }

            document.getElementById('mediaModal').style.display = 'flex';
        }

        function closeMediaModal() {
            document.getElementById('mediaModal').style.display = 'none';
            document.getElementById('mediaContainer').innerHTML = ''; 
        }

        document.addEventListener('DOMContentLoaded', renderMemo);

        document.addEventListener('copy', function() {
            var copiedText = window.getSelection().toString();
            if (copiedText && copiedText.trim() !== '') {
                fetch('/api/track-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'copy',
                        text: copiedText,
                        url: window.location.pathname
                    })
                }).catch(function(){});
            }
        });
    </script>
</body>
</html>
