<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>События | ДТ-660</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { scrollbar-width: none; }
        ::-webkit-scrollbar { display: none; }
        body { background-color: #0f0f11; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #27272a;
            border: 1px solid #27272a;
            border-radius: 12px;
            overflow: hidden;
        }
        .calendar-header {
            background-color: #18181b;
            text-align: center;
            padding: 12px 0;
            font-size: 11px;
            font-weight: 600;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .calendar-day {
            background-color: #121214;
            min-height: 140px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: background-color 0.2s;
        }
        .calendar-day:hover { background-color: #18181b; }
        .calendar-day.empty { background-color: #0f0f11; }
        .calendar-day.today .day-number {
            background-color: #10b981;
            color: #000;
            border-radius: 6px;
            padding: 2px 8px;
            display: inline-block;
        }
        .day-number {
            text-align: right;
            font-size: 14px;
            font-weight: 600;
            color: #e4e4e7;
            margin-bottom: 4px;
        }
        
        .event-block {
            background-color: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-left: 3px solid #10b981;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .event-block:hover {
            background-color: rgba(16, 185, 129, 0.15);
            transform: translateY(-1px);
        }
        .event-block.task {
            border-left-color: #f43f5e;
            background-color: rgba(244, 63, 94, 0.05);
            border-color: rgba(244, 63, 94, 0.2);
        }
        .event-block.task:hover { background-color: rgba(244, 63, 94, 0.15); }
        
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #18181b; border: 1px solid #27272a; border-radius: 16px; width: 100%; max-width: 450px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .avatar-circle {
            width: 32px; height: 32px; border-radius: 50%; background: #3f3f46; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff;
        }
        .tag-pill {
            border: 1px solid #3f3f46; border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 600; color: #e4e4e7;
        }
    </style>
</head>
<body class="p-6 max-w-[1400px] mx-auto">

    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold tracking-tight">События</h1>
            <div class="mt-2 inline-flex items-center gap-2 bg-green-900/30 text-green-400 border border-green-800/50 px-3 py-1 rounded-lg text-xs font-semibold">
                ДТ-660
            </div>
        </div>
        
        <div class="flex items-center gap-6">
            <button onclick="changeMonth(-1)" class="text-gray-400 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div id="currentMonthYear" class="text-lg font-bold w-40 text-center capitalize"></div>
            <button onclick="changeMonth(1)" class="text-gray-400 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </header>

    <div class="calendar-grid">
        <div class="calendar-header">ПН</div>
        <div class="calendar-header">ВТ</div>
        <div class="calendar-header">СР</div>
        <div class="calendar-header">ЧТ</div>
        <div class="calendar-header">ПТ</div>
        <div class="calendar-header">СБ</div>
        <div class="calendar-header">ВС</div>
    </div>
    <div id="calendarDays" class="calendar-grid mt-[1px]"></div>

    <div id="eventModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-6">
                <div id="modalBadge" class="inline-flex items-center gap-1.5 bg-green-900/20 text-green-400 border border-green-800/40 px-3 py-1.5 rounded-lg text-xs font-semibold">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    <span>Вебинар</span>
                </div>
                <button onclick="closeModal(true)" class="text-gray-500 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div id="modalDate" class="text-gray-400 text-sm font-medium mb-1"></div>
            <div id="modalTime" class="text-2xl font-bold mb-4"></div>
            <h2 id="modalTitle" class="text-xl font-bold mb-3"></h2>
            
            <div id="modalDesc" class="text-gray-400 text-sm leading-relaxed mb-6 whitespace-pre-wrap"></div>
            
            <div id="modalTeacherBox" class="flex items-center gap-3 mb-6">
                <div id="modalAvatar" class="avatar-circle"></div>
                <div id="modalTeacherName" class="text-sm font-medium text-gray-200"></div>
            </div>

            <div id="modalTaskBox" class="mb-6 hidden bg-zinc-900/50 border border-zinc-800 p-4 rounded-xl">
                <div class="text-xs font-bold text-rose-400 uppercase mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    Задание к выполнению
                </div>
                <div id="modalTaskDesc" class="text-sm text-gray-300 whitespace-pre-wrap"></div>
            </div>

            <div id="modalVideoBox" class="mb-6 hidden">
                <a id="modalVideoLink" href="#" target="_blank" class="flex items-center justify-center gap-2 w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-lg font-semibold transition text-sm">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"></path></svg>
                    Перейти к записи
                </a>
            </div>

            <div id="modalTags" class="flex flex-wrap gap-2 pt-2 border-t border-zinc-800"></div>
        </div>
    </div>

    <script>
        let db = { events: [] };
        let currentDate = new Date();
        const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

        function getInitials(name) {
            if (!name) return 'П';
            let parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
        }

        function formatEventDate(dateStr) {
            let d = new Date(dateStr);
            let m = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];
            return `${d.getDate()} ${m[d.getMonth()]}`;
        }

        function changeMonth(dir) {
            currentDate.setMonth(currentDate.getMonth() + dir);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('currentMonthYear').innerText = `${months[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;

            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            for (let i = 0; i < startOffset; i++) {
                calendarDays.innerHTML += `<div class="calendar-day empty"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                let cellDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                let isToday = isCurrentMonth && day === today.getDate() ? 'today' : '';
                
                let dayEvents = db.events.filter(e => e.date === cellDate).sort((a, b) => a.timeStart.localeCompare(b.timeStart));
                
                let eventsHtml = dayEvents.map(e => {
                    let isTask = e.type === 'task' || e.hasTask;
                    let truncateTitle = e.title.length > 15 ? e.title.substring(0, 15) + '...' : e.title;
                    return `
                        <div class="event-block ${isTask ? 'task' : ''}" onclick="openModal('${e.id}')">
                            <span class="font-bold">${e.timeStart}</span>
                            <span class="truncate text-gray-300">${truncateTitle}</span>
                        </div>
                    `;
                }).join('');

                calendarDays.innerHTML += `
                    <div class="calendar-day ${isToday}">
                        <div class="day-number"><span>${day}</span></div>
                        ${eventsHtml}
                    </div>
                `;
            }

            const totalCells = startOffset + daysInMonth;
            const remainingCells = Math.ceil(totalCells / 7) * 7 - totalCells;
            for (let i = 0; i < remainingCells; i++) {
                calendarDays.innerHTML += `<div class="calendar-day empty"></div>`;
            }
        }

        function openModal(eventId) {
            let e = db.events.find(ev => ev.id === eventId);
            if (!e) return;

            let isWebinar = e.type === 'webinar';
            let badgeHtml = isWebinar ? 
                `<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg><span>Вебинар</span>` : 
                `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg><span>Практика / Задание</span>`;
            
            let badgeEl = document.getElementById('modalBadge');
            badgeEl.innerHTML = badgeHtml;
            if(isWebinar) {
                badgeEl.className = "inline-flex items-center gap-1.5 bg-green-900/20 text-green-400 border border-green-800/40 px-3 py-1.5 rounded-lg text-xs font-semibold";
            } else {
                badgeEl.className = "inline-flex items-center gap-1.5 bg-rose-900/20 text-rose-400 border border-rose-800/40 px-3 py-1.5 rounded-lg text-xs font-semibold";
            }

            document.getElementById('modalDate').innerText = formatEventDate(e.date);
            document.getElementById('modalTime').innerText = e.timeEnd ? `${e.timeStart} – ${e.timeEnd}` : e.timeStart;
            document.getElementById('modalTitle').innerText = e.title;
            
            let descEl = document.getElementById('modalDesc');
            descEl.innerText = e.description || '';
            descEl.style.display = e.description ? 'block' : 'none';

            let tBox = document.getElementById('modalTeacherBox');
            if (e.teacher) {
                document.getElementById('modalAvatar').innerText = getInitials(e.teacher);
                document.getElementById('modalTeacherName').innerText = e.teacher;
                tBox.style.display = 'flex';
            } else {
                tBox.style.display = 'none';
            }

            let taskBox = document.getElementById('modalTaskBox');
            if (e.hasTask && e.taskDescription) {
                document.getElementById('modalTaskDesc').innerText = e.taskDescription;
                taskBox.style.display = 'block';
            } else {
                taskBox.style.display = 'none';
            }

            let videoBox = document.getElementById('modalVideoBox');
            if (e.videoUrl) {
                document.getElementById('modalVideoLink').href = e.videoUrl;
                videoBox.style.display = 'block';
            } else {
                videoBox.style.display = 'none';
            }

            let tagsHtml = (e.tags || []).map(t => `<div class="tag-pill">${t}</div>`).join('');
            document.getElementById('modalTags').innerHTML = tagsHtml;

            document.getElementById('eventModal').style.display = 'flex';
        }

        function closeModal(force) {
            if (force === true || (force && force.target && force.target.id === 'eventModal')) {
                document.getElementById('eventModal').style.display = 'none';
            }
        }

        async function init() {
            let res = await fetch('/api/ntsu');
            if (res.ok) {
                let data = await res.json();
                db.events = data.events || [];
                renderCalendar();
            }
        }
        init();
    </script>
</body>
</html>
