<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>События | ДТ-660</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style>
        * { scrollbar-width: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        body { background-color: #09090b; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
        
        .calendar-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #27272a;
            border: 1px solid #27272a;
            border-radius: 12px;
            overflow: hidden;
            min-width: 800px;
        }
        .calendar-header {
            background-color: #18181b;
            text-align: center;
            padding: 12px 0;
            font-size: 11px;
            font-weight: 600;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .calendar-day {
            background-color: #121214;
            min-height: 120px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: background-color 0.2s;
        }
        @media (min-width: 768px) {
            .calendar-day { min-height: 140px; padding: 10px; }
        }
        .calendar-day:hover { background-color: #18181b; }
        .calendar-day.empty { background-color: #09090b; }
        .calendar-day.today .day-number {
            background-color: #10b981;
            color: #000;
            border-radius: 6px;
            padding: 2px 8px;
            display: inline-block;
        }
        .day-number {
            text-align: right;
            font-size: 14px;
            font-weight: 600;
            color: #e4e4e7;
            margin-bottom: 4px;
        }
        
        .event-block {
            background-color: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-left: 3px solid #10b981;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .event-block:hover {
            background-color: rgba(16, 185, 129, 0.15);
            transform: translateY(-1px);
        }
        .event-block.task {
            border-left-color: #f43f5e;
            background-color: rgba(244, 63, 94, 0.08);
            border-color: rgba(244, 63, 94, 0.2);
        }
        .event-block.task:hover { background-color: rgba(244, 63, 94, 0.15); }
        
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px;
        }
        .modal-content {
            background: #121214; border: 1px solid #27272a; border-radius: 20px; width: 100%; max-width: 900px; 
            max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        @media (min-width: 768px) {
            .modal-content { padding: 40px; }
        }
        
        .avatar-circle {
            width: 40px; height: 40px; border-radius: 50%; background: #27272a; border: 1px solid #3f3f46; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: #fff;
        }

        .prose-custom img {
            border-radius: 12px;
            border: 1px solid #27272a;
            max-height: 600px;
            object-fit: contain;
            background: #09090b;
            margin-top: 1.5em;
            margin-bottom: 1.5em;
        }
    </style>
</head>
<body class="p-4 md:p-8 max-w-[1600px] mx-auto">

    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-10 gap-4">
        <div>
            <h1 class="text-3xl md:text-4xl font-black tracking-tight text-white">Учебный план</h1>
            <div class="mt-2 inline-flex items-center gap-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-lg text-sm font-bold tracking-widest">
                ДТ-660
            </div>
        </div>
        
        <div class="flex items-center justify-between w-full md:w-auto gap-4 md:gap-6 bg-zinc-900/80 border border-zinc-800 px-4 py-2.5 rounded-xl shadow-lg backdrop-blur-md">
            <button onclick="changeMonth(-1)" class="text-zinc-400 hover:text-white transition p-2 bg-zinc-800/50 hover:bg-zinc-700 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div id="currentMonthYear" class="text-lg md:text-xl font-black w-40 text-center capitalize tracking-wide text-zinc-100"></div>
            <button onclick="changeMonth(1)" class="text-zinc-400 hover:text-white transition p-2 bg-zinc-800/50 hover:bg-zinc-700 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </header>

    <div class="calendar-wrapper">
        <div class="calendar-grid">
            <div class="calendar-header">ПН</div>
            <div class="calendar-header">ВТ</div>
            <div class="calendar-header">СР</div>
            <div class="calendar-header">ЧТ</div>
            <div class="calendar-header">ПТ</div>
            <div class="calendar-header">СБ</div>
            <div class="calendar-header">ВС</div>
        </div>
        <div id="calendarDays" class="calendar-grid mt-[1px]"></div>
    </div>

    <div id="eventModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-6 border-b border-zinc-800/60 pb-5">
                <div id="modalBadge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest">
                </div>
                <button onclick="closeModal(true)" class="text-zinc-400 hover:text-white transition bg-zinc-800 hover:bg-zinc-700 p-2 rounded-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 mb-5">
                <div id="modalDate" class="text-emerald-400 text-sm font-black uppercase tracking-wider bg-emerald-400/10 px-3 py-1.5 rounded-md border border-emerald-500/20"></div>
                <div id="modalTime" class="text-zinc-300 text-sm font-mono bg-zinc-800/80 border border-zinc-700 px-3 py-1.5 rounded-md"></div>
                <div id="modalCustomType" class="text-purple-400 text-sm font-bold bg-purple-400/10 border border-purple-500/20 px-3 py-1.5 rounded-md hidden"></div>
            </div>
            
            <h2 id="modalTitle" class="text-2xl md:text-3xl font-black mb-6 tracking-tight text-white leading-tight"></h2>
            
            <div id="modalTeacherBox" class="flex items-center gap-3 mb-8 bg-zinc-900 inline-flex px-4 py-3 rounded-2xl border border-zinc-800 shadow-inner">
                <div id="modalAvatar" class="avatar-circle"></div>
                <div>
                    <div class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest mb-0.5">Преподаватель</div>
                    <div id="modalTeacherName" class="text-sm font-bold text-zinc-100"></div>
                </div>
            </div>
            
            <div id="modalDesc" class="prose prose-invert prose-custom max-w-none mb-10"></div>
            
            <div id="modalTaskBox" class="mb-8 hidden bg-[#1a0f14] border border-rose-900/40 p-6 md:p-8 rounded-3xl shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1.5 h-full bg-rose-500"></div>
                <div class="text-xs font-black text-rose-500 uppercase tracking-widest mb-6 flex items-center gap-2 border-b border-rose-900/30 pb-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    Блок задания
                </div>
                <div id="modalTaskDesc" class="prose prose-invert prose-custom max-w-none text-zinc-200"></div>
            </div>

            <div id="modalVideoBox" class="mt-8 hidden pt-8 border-t border-zinc-800/60">
                <a id="modalVideoLink" href="#" target="_blank" class="flex items-center justify-center gap-3 w-full bg-purple-600 hover:bg-purple-500 text-white py-4 rounded-2xl font-black tracking-widest uppercase transition shadow-lg shadow-purple-900/20">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"></path></svg>
                    Открыть запись
                </a>
            </div>
        </div>
    </div>

    <script>
        let db = { events: [] };
        let currentDate = new Date();
        const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

        function getInitials(name) {
            if (!name) return 'П';
            let parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
        }

        function formatEventDate(dateStr) {
            let d = new Date(dateStr);
            let m = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];
            return `${d.getDate()} ${m[d.getMonth()]}`;
        }

        function changeMonth(dir) {
            currentDate.setMonth(currentDate.getMonth() + dir);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('currentMonthYear').innerText = `${months[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;

            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            for (let i = 0; i < startOffset; i++) {
                calendarDays.innerHTML += `<div class="calendar-day empty"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                let cellDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                let isToday = isCurrentMonth && day === today.getDate() ? 'today' : '';
                
                let dayEvents = db.events.filter(e => e.date === cellDate).sort((a, b) => a.timeStart.localeCompare(b.timeStart));
                
                let eventsHtml = dayEvents.map(e => {
                    let isTask = e.hasTask || (e.type && e.type.toLowerCase().includes('задан'));
                    let truncateTitle = e.title.length > 22 ? e.title.substring(0, 22) + '...' : e.title;
                    return `
                        <div class="event-block ${isTask ? 'task' : ''}" onclick="openModal('${e.id}')">
                            <span class="font-black tracking-tight">${e.timeStart}</span>
                            <span class="truncate text-zinc-300 font-semibold mt-0.5">${truncateTitle}</span>
                        </div>
                    `;
                }).join('');

                calendarDays.innerHTML += `
                    <div class="calendar-day ${isToday}">
                        <div class="day-number"><span>${day}</span></div>
                        ${eventsHtml}
                    </div>
                `;
            }

            const totalCells = startOffset + daysInMonth;
            const remainingCells = Math.ceil(totalCells / 7) * 7 - totalCells;
            for (let i = 0; i < remainingCells; i++) {
                calendarDays.innerHTML += `<div class="calendar-day empty"></div>`;
            }
        }

        function openModal(eventId) {
            let e = db.events.find(ev => ev.id === eventId);
            if (!e) return;

            let isTaskType = e.hasTask || (e.type && e.type.toLowerCase().includes('задан'));
            let badgeHtml = !isTaskType ? 
                `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg><span>Лекция / Материал</span>` : 
                `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg><span>Практика / Задание</span>`;
            
            let badgeEl = document.getElementById('modalBadge');
            badgeEl.innerHTML = badgeHtml;
            if(!isTaskType) {
                badgeEl.className = "inline-flex items-center gap-2 bg-emerald-900/30 text-emerald-400 border border-emerald-800/50 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest";
            } else {
                badgeEl.className = "inline-flex items-center gap-2 bg-rose-900/30 text-rose-400 border border-rose-800/50 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest";
            }

            document.getElementById('modalDate').innerText = formatEventDate(e.date);
            document.getElementById('modalTime').innerText = e.timeEnd ? `${e.timeStart} – ${e.timeEnd}` : e.timeStart;
            
            let typeEl = document.getElementById('modalCustomType');
            if (e.type && e.type.trim() !== '') {
                typeEl.innerText = e.type;
                typeEl.style.display = 'block';
            } else {
                typeEl.style.display = 'none';
            }

            document.getElementById('modalTitle').innerText = e.title;
            
            let descEl = document.getElementById('modalDesc');
            descEl.innerHTML = e.description || '';
            descEl.style.display = e.description ? 'block' : 'none';

            let tBox = document.getElementById('modalTeacherBox');
            if (e.teacher) {
                document.getElementById('modalAvatar').innerText = getInitials(e.teacher);
                document.getElementById('modalTeacherName').innerText = e.teacher;
                tBox.style.display = 'flex';
            } else {
                tBox.style.display = 'none';
            }

            let taskBox = document.getElementById('modalTaskBox');
            if (e.hasTask && e.taskDescription) {
                document.getElementById('modalTaskDesc').innerHTML = e.taskDescription;
                taskBox.style.display = 'block';
            } else {
                taskBox.style.display = 'none';
            }

            let videoBox = document.getElementById('modalVideoBox');
            if (e.videoUrl) {
                document.getElementById('modalVideoLink').href = e.videoUrl;
                videoBox.style.display = 'block';
            } else {
                videoBox.style.display = 'none';
            }

            document.body.style.overflow = 'hidden';
            document.getElementById('eventModal').style.display = 'flex';
        }

        function closeModal(force) {
            if (force === true || (force && force.target && force.target.id === 'eventModal')) {
                document.getElementById('eventModal').style.display = 'none';
                document.body.style.overflow = '';
            }
        }

        async function init() {
            let res = await fetch('/api/ntsu?t=' + Date.now());
            if (res.ok) {
                let data = await res.json();
                db.events = data.events || [];
                renderCalendar();
            }
        }
        init();
    </script>
</body>
</html>
