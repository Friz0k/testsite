<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frizworld Портфолио</title>
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #121214;
            --border-color: #7c3aed;
            --accent-color: #a855f7;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 40px;
            max-width: 1000px;
            width: 100%;
            align-items: center;
        }

        .illustration-box {
            width: 350px;
            height: 450px;
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--panel-bg);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.2);
        }

        .illustration-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .placeholder-content {
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        .placeholder-content svg {
            width: 64px;
            height: 64px;
            fill: var(--accent-color);
            margin-bottom: 15px;
        }

        .placeholder-content h3 {
            color: var(--accent-color);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .placeholder-content p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .content-section { flex-grow: 1; }

        h1 { font-size: 32px; margin-bottom: 20px; color: var(--text-main); }
        p { color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }

        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .project-item {
            background: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .project-item:hover { border-color: var(--accent-color); }

        .btn-group { display: flex; gap: 10px; align-items: center; }

        .btn-link, .btn-details {
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-link { background: #7c3aed; color: #fff; }
        .btn-link:hover { background: #6d28d9; }

        .btn-details { background: #27272a; color: #fff; }
        .btn-details:hover { background: #3f3f46; }

        #detailsModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 14px;
            width: 90%;
            max-width: 500px;
            color: #fff;
            position: relative;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 24px;
            color: var(--text-muted);
        }

        .modal-img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="illustration-box" id="illustrationContainer">
            <img id="mainIllustration" src="" alt="Арт" style="display: none;">
            <div class="placeholder-content" id="placeholderText">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v4z"/></svg>
                <h3>Место под иллюстрацию</h3>
                <p>Добавь сюда свой арт в коде</p>
            </div>
        </div>

        <div class="content-section">
            <h1>Frizworld Systems</h1>
            <p>Добро пожаловать в систему управления проектами и аттестациями.</p>
            <div class="projects-list" id="projectsContainer"></div>
        </div>
    </div>

    <div id="detailsModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeDetails()">&times;</span>
            <img id="modalImg" class="modal-img" src="" alt="Project Image">
            <h3 id="modalTitle" style="color: var(--accent-color); margin-bottom: 15px; font-size: 22px;"></h3>
            <p id="modalDesc" style="color: var(--text-muted); line-height: 1.6;"></p>
        </div>
    </div>

    <script>
    fetch('/api/settings')
        .then(res => res.json())
        .then(data => {
            if (data.illustrationUrl) {
                let img = document.getElementById('mainIllustration');
                let placeholder = document.getElementById('placeholderText');
                img.src = data.illustrationUrl;
                img.style.display = 'block';
                placeholder.style.display = 'none';
            }
        });

    fetch('/api/projects')
        .then(res => res.json())
        .then(projects => {
            let container = document.getElementById('projectsContainer');
            container.innerHTML = '';
            if (projects && projects.length > 0) {
                projects.forEach(p => {
                    let div = document.createElement('div');
                    div.className = 'project-item';
                    
                    let span = document.createElement('span');
                    span.textContent = p.title || 'Проект';
                    div.appendChild(span);

                    let btnGroup = document.createElement('div');
                    btnGroup.className = 'btn-group';

                    if (p.path) {
                        let a = document.createElement('a');
                        a.className = 'btn-link';
                        a.href = p.path;
                        a.textContent = 'Открыть';
                        btnGroup.appendChild(a);
                    }

                    let btnDet = document.createElement('button');
                    btnDet.className = 'btn-details';
                    btnDet.textContent = 'Подробнее';
                    btnDet.onclick = function() {
                        openDetails(p.title || 'Проект', p.desc || 'Описание отсутствует.', p.imageUrl || '');
                    };
                    btnGroup.appendChild(btnDet);

                    div.appendChild(btnGroup);
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = '<p style="color: var(--accent-color);">Проекты пока не добавлены.</p>';
            }
        });

    function openDetails(title, desc, imageUrl) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalDesc').textContent = desc;
        let img = document.getElementById('modalImg');
        if (imageUrl) {
            img.src = imageUrl;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }
        document.getElementById('detailsModal').style.display = 'flex';
    }

    function closeDetails() {
        document.getElementById('detailsModal').style.display = 'none';
    }

    window.onclick = function(event) {
        let modal = document.getElementById('detailsModal');
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    }
    </script>
</body>
</html>
