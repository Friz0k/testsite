<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friz World | Portfolio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥶</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        ::-webkit-scrollbar {
            display: none;
        }
        
        :root {
            --primary: #8a2be2;
            --primary-light: #b026ff;
            --bg: #050505;
            --card-bg: rgba(15, 15, 40, 0.4);
            --border: rgba(138, 43, 226, 0.3);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px 60px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(138, 43, 226, 0.15) 0%, transparent 60%);
        }

        .top-nav {
            max-width: 1500px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: flex-end;
        }

        .admin-link {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-link:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .header {
            text-align: center;
            margin: 20px auto 40px;
            max-width: 800px;
        }

        .header h1 {
            font-size: 46px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .header h1 span {
            color: var(--primary-light);
        }

        .header p {
            color: var(--text-muted);
            font-size: 18px;
            margin-bottom: 30px;
        }

        .illustration-box {
            max-width: 1000px;
            margin: 0 auto 40px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: none;
        }

        .illustration-img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            display: block;
            image-rendering: auto;
            image-rendering: smooth;
            transform: translateZ(0);
            filter: blur(0.3px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-light);
            box-shadow: 0 12px 35px rgba(138, 43, 226, 0.25);
        }

        .card-img-wrap {
            width: 100%;
            height: 240px;
            background: #0a0a14;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
            image-rendering: auto;
            image-rendering: smooth;
            transform: translateZ(0);
            backface-visibility: hidden;
            filter: blur(0.3px);
        }

        .card:hover .card-img {
            transform: scale(1.05) translateZ(0);
        }

        .card-no-img {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: rgba(138, 43, 226, 0.4);
        }

        .card-info {
            padding: 22px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-info h3 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .card-info p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
        }

        .tag {
            background: rgba(138, 43, 226, 0.15);
            border: 1px solid rgba(138, 43, 226, 0.3);
            color: #d8b4fe;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: rgba(15, 15, 40, 0.2);
            border: 1px dashed var(--border);
            border-radius: 16px;
            font-size: 16px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f0f1c;
            border: 1px solid var(--primary);
            border-radius: 20px;
            max-width: 750px;
            width: 100%;
            padding: 35px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 30px;
            color: #a1a1aa;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-img {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            image-rendering: auto;
            image-rendering: smooth;
            transform: translateZ(0);
            filter: blur(0.3px);
        }

        .modal-title {
            font-size: 26px;
            color: #fff;
            margin-bottom: 15px;
        }

        .modal-desc {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
            white-space: pre-wrap;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .card-btn {
            background: var(--primary);
            color: #fff;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: 0.2s;
        }

        .card-btn:hover {
            background: var(--primary-light);
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
        }

        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 34px;
            }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="/login" class="admin-link"><i class="fas fa-terminal"></i> Панель управления</a>
    </div>

    <header class="header">
        <h1>FRIZ <span>WORLD</span></h1>
        <p>Портфолио проектов и веб-системы GTA5RP</p>
        <div class="illustration-box" id="illustrationBox">
            <img src="" id="illustrationImg" class="illustration-img" alt="">
        </div>
    </header>

    <div class="grid" id="projectsGrid"></div>

    <div class="modal-overlay" id="detailsModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img src="" id="modalImg" class="modal-img" alt="">
            <h2 id="modalTitle" class="modal-title"></h2>
            <p id="modalDesc" class="modal-desc"></p>
            <div id="modalActions" class="modal-actions"></div>
        </div>
    </div>

    <script>
        let allProjects = [];

        async function loadData() {
            try {
                const setRes = await fetch('/api/settings');
                if (setRes.ok) {
                    const settings = await setRes.json();
                    if (settings.illustrationUrl) {
                        const illBox = document.getElementById('illustrationBox');
                        const illImg = document.getElementById('illustrationImg');
                        illImg.src = settings.illustrationUrl;
                        illBox.style.display = 'block';
                    }
                }

                const res = await fetch('/api/projects');
                if (!res.ok) return;
                allProjects = await res.json();
                
                const grid = document.getElementById('projectsGrid');
                grid.innerHTML = '';

                if (allProjects.length === 0) {
                    grid.innerHTML = '<div class="empty-msg">Список проектов пуст</div>';
                    return;
                }

                allProjects.forEach((p, index) => {
                    const title = p.title || 'Проект';
                    const desc = p.shortDesc || p.desc || p.fullDesc || '';
                    const imgUrl = p.imageUrl || p.image;
                    
                    let tagsHtml = '';
                    if (Array.isArray(p.tags)) {
                        tagsHtml = p.tags.map(t => `<span class="tag">${t}</span>`).join('');
                    } else if (typeof p.tags === 'string' && p.tags.trim() !== '') {
                        tagsHtml = p.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('');
                    }

                    const imgTag = imgUrl 
                        ? `<img src="${imgUrl}" class="card-img" alt="">` 
                        : `<div class="card-no-img"><i class="fas fa-layer-group"></i></div>`;

                    grid.innerHTML += `
                        <div class="card" onclick="openModal(${index})">
                            <div class="card-img-wrap">
                                ${imgTag}
                            </div>
                            <div class="card-info">
                                <h3>${title}</h3>
                                <p>${desc}</p>
                                <div class="card-tags">${tagsHtml}</div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {}
        }

        function openModal(index) {
            const p = allProjects[index];
            if (!p) return;

            document.getElementById('modalTitle').textContent = p.title || 'Проект';
            document.getElementById('modalDesc').innerText = p.fullDesc || p.desc || 'Полное описание отсутствует.';
            
            let img = document.getElementById('modalImg');
            const imgUrl = p.imageUrl || p.image;
            if (imgUrl) {
                img.src = imgUrl;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }

            let actions = document.getElementById('modalActions');
            actions.innerHTML = '';
            const pathUrl = p.path || p.link;
            if (pathUrl) {
                let testBtn = document.createElement('a');
                testBtn.className = 'card-btn';
                testBtn.href = pathUrl;
                testBtn.target = '_blank';
                testBtn.textContent = 'Открыть и протестировать';
                actions.appendChild(testBtn);
            }

            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        window.onclick = function(event) {
            let modal = document.getElementById('detailsModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
