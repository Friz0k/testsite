<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frizworld Портфолио</title>
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #121214;
            --border-color: #7c3aed;
            --accent-color: #a855f7;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 40px;
            max-width: 1000px;
            width: 100%;
            align-items: center;
        }

        .illustration-box {
            width: 350px;
            height: 450px;
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--panel-bg);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.2);
        }

        .illustration-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .placeholder-content {
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        .placeholder-content svg {
            width: 64px;
            height: 64px;
            fill: var(--accent-color);
            margin-bottom: 15px;
        }

        .placeholder-content h3 {
            color: var(--accent-color);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .placeholder-content p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .content-section {
            flex-grow: 1;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .project-item {
            background: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .project-item:hover {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Блок иллюстрации, куда автоматически подставляется арт -->
        <div class="illustration-box" id="illustrationContainer">
            <img id="mainIllustration" src="" alt="Арт" style="display: none;">
            <div class="placeholder-content" id="placeholderText">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v4z"/></svg>
                <h3>Место под иллюстрацию</h3>
                <p>Загрузите арт через админ-панель</p>
            </div>
        </div>

        <div class="content-section">
            <h1>Frizworld Systems</h1>
            <p>Добро пожаловать в систему управления проектами и аттестациями.</p>
            <div class="projects-list" id="projectsContainer">
                <!-- Проекты подгружаются динамически -->
            </div>
        </div>
    </div>

    <script>
    // Загрузка настроек и подстановка арта на главную страницу
    fetch('/api/settings')
        .then(res => res.json())
        .then(data => {
            if (data.illustrationUrl) {
                let img = document.getElementById('mainIllustration');
                let placeholder = document.getElementById('placeholderText');
                img.src = data.illustrationUrl;
                img.style.display = 'block';
                placeholder.style.display = 'none';
            }
        });

    // Загрузка списка проектов
    fetch('/api/projects')
        .then(res => res.json())
        .then(projects => {
            let container = document.getElementById('projectsContainer');
            container.innerHTML = '';
            if (projects && projects.length > 0) {
                projects.forEach(p => {
                    let a = document.createElement('a');
                    a.className = 'project-item';
                    a.href = p.path || '#';
                    a.innerHTML = `<span>${p.title || 'Проект'}</span> <span style="color: #7c3aed;">&rarr;</span>`;
                    container.appendChild(a);
                });
            } else {
                container.innerHTML = '<p style="color: #7c3aed;">Проекты пока не добавлены.</p>';
            }
        });
    </script>
</body>
</html>
