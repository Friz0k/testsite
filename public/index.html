<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frizworld Systems</title>
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #121214;
            --border-color: #27272a;
            --accent-color: #7c3aed;
            --accent-hover: #6d28d9;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-wrapper {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 850px) {
            .main-wrapper {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }

        /* Блок иллюстрации слева */
        .illustration-box {
            width: 100%;
            height: 480px;
            border: 2px dashed var(--accent-color);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #050507;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.15);
        }

        .illustration-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .placeholder-content {
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        .placeholder-content svg {
            width: 54px;
            height: 54px;
            fill: var(--accent-color);
            margin-bottom: 15px;
        }

        .placeholder-content h3 {
            color: var(--accent-color);
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .placeholder-content p {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Правая часть с контентом и проектами */
        .content-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .project-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .project-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .project-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-main);
        }

        .project-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: background 0.2s;
        }

        .btn-open {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-open:hover {
            background-color: var(--accent-hover);
        }

        .btn-details {
            background-color: #27272a;
            color: var(--text-main);
        }

        .btn-details:hover {
            background-color: #3f3f46;
        }

        /* Модальное окно "Подробнее" */
        #detailsModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid var(--border-color);
        }

        .modal-title {
            color: var(--accent-color);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .modal-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Блок иллюстрации слева -->
        <div class="illustration-box" id="illustrationContainer">
            <img id="mainIllustration" src="" alt="Арт" style="display: none;">
            <div class="placeholder-content" id="placeholderText">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v4z"/></svg>
                <h3>Место под иллюстрацию</h3>
                <p>Добавь сюда свой арт в коде</p>
            </div>
        </div>

        <!-- Контент справа -->
        <div class="content-section">
            <h1>Frizworld Systems</h1>
            <p class="subtitle">Интегрированная система управления ведомствами, кадрами и аттестациями.</p>
            <div class="projects-grid" id="projectsContainer">
                <!-- Проекты загружаются автоматически -->
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="detailsModal">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <img id="modalImg" class="modal-img" src="" alt="Фото проекта">
            <h3 id="modalTitle" class="modal-title"></h3>
            <p id="modalDesc" class="modal-desc"></p>
        </div>
    </div>

    <script>
        // Подгрузка иллюстрации сайта
        fetch('/api/settings')
            .then(res => res.json())
            .then(data => {
                if (data.illustrationUrl) {
                    let img = document.getElementById('mainIllustration');
                    let placeholder = document.getElementById('placeholderText');
                    img.src = data.illustrationUrl;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                }
            })
            .catch(err => console.error(err));

        // Подгрузка списка проектов
        fetch('/api/projects')
            .then(res => res.json())
            .then(projects => {
                let container = document.getElementById('projectsContainer');
                container.innerHTML = '';
                if (projects && projects.length > 0) {
                    projects.forEach(p => {
                        let card = document.createElement('div');
                        card.className = 'project-card';

                        let titleSpan = document.createElement('span');
                        titleSpan.className = 'project-title';
                        titleSpan.textContent = p.title || 'Система';
                        card.appendChild(titleSpan);

                        let actionsDiv = document.createElement('div');
                        actionsDiv.className = 'project-actions';

                        if (p.path) {
                            let openBtn = document.createElement('a');
                            openBtn.className = 'btn btn-open';
                            openBtn.href = p.path;
                            openBtn.textContent = 'Открыть';
                            actionsDiv.appendChild(openBtn);
                        }

                        let detailsBtn = document.createElement('button');
                        detailsBtn.className = 'btn btn-details';
                        detailsBtn.textContent = 'Подробнее';
                        detailsBtn.onclick = function() {
                            openModal(p.title || 'Информация', p.desc || 'Описание отсутствует.', p.imageUrl || '');
                        };
                        actionsDiv.appendChild(detailsBtn);

                        card.appendChild(actionsDiv);
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Проекты пока не добавлены через админ-панель.</p>';
                }
            })
            .catch(err => {
                document.getElementById('projectsContainer').innerHTML = '<p style="color: #ef4444;">Ошибка загрузки проектов.</p>';
            });

        // Управление модальным окном
        function openModal(title, desc, imageUrl) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = desc;
            let img = document.getElementById('modalImg');
            if (imageUrl) {
                img.src = imageUrl;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        window.onclick = function(event) {
            let modal = document.getElementById('detailsModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
