<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель Friz World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #050505; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: #0a0a0a; border-right: 2px solid #8a2be2; padding: 40px 20px; display: flex; flex-direction: column; gap: 15px; }
        .sidebar h2 { color: #fff; margin-bottom: 30px; font-size: 22px; text-transform: uppercase; text-align: center; }
        .sidebar h2 span { color: #8a2be2; }
        .menu-btn { background: #11051f; border: 1px solid #2a114d; color: #fff; padding: 15px; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 600; text-transform: uppercase; transition: 0.3s; }
        .menu-btn:hover, .menu-btn.active { background: #8a2be2; border-color: #b026ff; box-shadow: 0 0 15px rgba(138,43,226,0.4); }
        
        .content { flex: 1; padding: 40px; overflow-y: auto; }
        .panel { display: none; }
        .panel.active { display: block; }
        h1 { font-size: 28px; margin-bottom: 30px; border-bottom: 2px solid #1a0b2e; padding-bottom: 10px; text-transform: uppercase; }
        .card { background: #0a0a0a; border: 1px solid #2a114d; border-radius: 12px; padding: 30px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ccc; font-size: 13px; text-transform: uppercase; font-weight: 600; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 12px; background: #000; border: 1px solid #4a1587; border-radius: 6px; color: #fff; font-size: 15px; outline: none; }
        textarea { height: 100px; resize: vertical; }
        input:focus, textarea:focus { border-color: #b026ff; }
        .btn { background: #8a2be2; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: #b026ff; box-shadow: 0 0 15px rgba(176,38,255,0.4); }
        .btn-danger { background: #ff3333; }
        .btn-danger:hover { background: #ff5555; }
        
        .project-item { display: flex; justify-content: space-between; align-items: center; background: #11051f; padding: 15px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #2a114d; }
        .question-box { background: #11051f; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2a114d; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>АДМИН <span>ПАНЕЛЬ</span></h2>
        <button class="menu-btn active" onclick="switchTab('projectsTab')">Управление проектами</button>
        <button class="menu-btn" onclick="switchTab('configTab')">Переменные и Конфиг</button>
        <button class="menu-btn" onclick="switchTab('testTab')">Вопросы переаттестации</button>
        <button class="menu-btn" onclick="window.location.href='/'" style="margin-top:auto; background:#000;">На сайт</button>
        <button class="menu-btn" onclick="window.location.href='/logout'" style="background:#220000; border-color:#550000;">Выйти</button>
    </div>

    <div class="content">
        <div id="projectsTab" class="panel active">
            <h1>Добавить / Удалить проекты</h1>
            <div class="card">
                <form id="projectForm" onsubmit="addProject(event)">
                    <div class="form-group"><label>Название проекта</label><input type="text" id="pTitle" required></div>
                    <div class="form-group"><label>Описание</label><textarea id="pDesc" required></textarea></div>
                    <div class="form-group"><label>Теги (через запятую)</label><input type="text" id="pTags" placeholder="Python, Web, GTA5RP"></div>
                    <div class="form-group"><label>Ссылка (О проекте / GitHub)</label><input type="text" id="pLink" placeholder="https://github.com/..."></div>
                    <div class="form-group"><label>Иллюстрация (Картинка)</label><input type="file" id="pImage" accept="image/*" style="color:#fff;"></div>
                    <button type="submit" class="btn">Добавить проект</button>
                </form>
            </div>
            <div class="card">
                <h3 style="margin-bottom:15px;">Существующие проекты</h3>
                <div id="projectsList">Загрузка...</div>
            </div>
        </div>

        <div id="configTab" class="panel">
            <h1>Глобальные переменные</h1>
            <div class="card">
                <form id="configForm" onsubmit="saveConfig(event)">
                    <div class="form-group"><label>Вебхук LSSD</label><input type="text" id="whLssd"></div>
                    <div class="form-group"><label>Вебхук LSPD</label><input type="text" id="whLspd"></div>
                    <div class="form-group"><label>Вебхук GOV</label><input type="text" id="whGov"></div>
                    <div class="form-group"><label>Вебхук CID</label><input type="text" id="whCid"></div>
                    <div class="form-group"><label>Вебхук FIB</label><input type="text" id="whFib"></div>
                    <div class="form-group"><label>ID ролей для упоминания (через запятую)</label><input type="text" id="roleIds"></div>
                    <div class="form-group"><label>Балловая система (Настройки текстом / JSON)</label><textarea id="pointsSys"></textarea></div>
                    <button type="submit" class="btn">Сохранить изменения</button>
                </form>
            </div>
        </div>

        <div id="testTab" class="panel">
            <h1>Настройка тестов и вопросов</h1>
            <div class="card">
                <div style="display:flex; gap:20px; margin-bottom:20px;">
                    <div style="flex:1;"><label>Всего вопросов в тесте</label><input type="number" id="testCount"></div>
                    <div style="flex:1;"><label>Проходной балл</label><input type="number" id="testPassing"></div>
                </div>
                <h3 style="margin-bottom:15px;">Список вопросов</h3>
                <div id="questionsList"></div>
                <button type="button" class="btn" onclick="addQuestionField()" style="margin-top:15px;">+ Добавить вопрос</button>
                <div style="margin-top: 30px;">
                    <button type="button" class="btn" onclick="saveTestConfig()" style="background:#00ffaa; color:#000;">Сохранить тест на сервер</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalConfig = {};

        function switchTab(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }

        function loadAdminData() {
            fetch('/api/projects').then(res => res.json()).then(projects => {
                const list = document.getElementById('projectsList');
                list.innerHTML = '';
                projects.forEach(p => {
                    list.innerHTML += `
                        <div class="project-item">
                            <span><b>${p.title}</b></span>
                            <button class="btn btn-danger" onclick="deleteProject(${p.id})">Удалить</button>
                        </div>
                    `;
                });
            });

            fetch('/api/config').then(res => res.json()).then(cfg => {
                globalConfig = cfg;
                document.getElementById('whLssd').value = cfg.webhooks?.lssd || '';
                document.getElementById('whLspd').value = cfg.webhooks?.lspd || '';
                document.getElementById('whGov').value = cfg.webhooks?.gov || '';
                document.getElementById('whCid').value = cfg.webhooks?.cid || '';
                document.getElementById('whFib').value = cfg.webhooks?.fib || '';
                document.getElementById('roleIds').value = cfg.roles || '';
                document.getElementById('pointsSys').value = cfg.pointsSystem || '';
                
                document.getElementById('testCount').value = cfg.testSettings?.questionsCount || 0;
                document.getElementById('testPassing').value = cfg.testSettings?.passingScore || 0;
                
                renderQuestions(cfg.testSettings?.questions || []);
            });
        }

        function addProject(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('pTitle').value);
            formData.append('desc', document.getElementById('pDesc').value);
            formData.append('tags', document.getElementById('pTags').value);
            formData.append('link', document.getElementById('pLink').value);
            formData.append('image', document.getElementById('pImage').files[0]);

            fetch('/api/projects', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    document.getElementById('projectForm').reset();
                    loadAdminData();
                });
        }

        function deleteProject(id) {
            if(!confirm('Точно удалить проект?')) return;
            fetch(`/api/projects/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    loadAdminData();
                });
        }

        function saveConfig(e) {
            e.preventDefault();
            globalConfig.webhooks.lssd = document.getElementById('whLssd').value;
            globalConfig.webhooks.lspd = document.getElementById('whLspd').value;
            globalConfig.webhooks.gov = document.getElementById('whGov').value;
            globalConfig.webhooks.cid = document.getElementById('whCid').value;
            globalConfig.webhooks.fib = document.getElementById('whFib').value;
            globalConfig.roles = document.getElementById('roleIds').value;
            globalConfig.pointsSystem = document.getElementById('pointsSys').value;

            sendConfigToServer();
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questionsList');
            container.innerHTML = '';
            questions.forEach((q, idx) => {
                container.innerHTML += `
                    <div class="question-box">
                        <label>Вопрос #${idx+1}</label>
                        <input type="text" class="q-text" value="${q.q}" style="margin-bottom:10px;">
                        <label>Варианты ответа (через запятую)</label>
                        <input type="text" class="q-opts" value="${q.options.join(', ')}" style="margin-bottom:10px;">
                        <label>Индекс правильного ответа (с 0)</label>
                        <input type="number" class="q-corr" value="${q.correct}" style="width:100px;">
                    </div>
                `;
            });
        }

        function addQuestionField() {
            if(!globalConfig.testSettings) globalConfig.testSettings = { questions: [] };
            globalConfig.testSettings.questions.push({ q: "Новый вопрос?", options: ["Ответ 1", "Ответ 2"], correct: 0 });
            renderQuestions(globalConfig.testSettings.questions);
        }

        function saveTestConfig() {
            globalConfig.testSettings.questionsCount = parseInt(document.getElementById('testCount').value);
            globalConfig.testSettings.passingScore = parseInt(document.getElementById('testPassing').value);
            
            const boxes = document.querySelectorAll('.question-box');
            const newQ = [];
            boxes.forEach(b => {
                newQ.push({
                    q: b.querySelector('.q-text').value,
                    options: b.querySelector('.q-opts').value.split(',').map(s => s.trim()),
                    correct: parseInt(b.querySelector('.q-corr').value)
                });
            });
            globalConfig.testSettings.questions = newQ;
            sendConfigToServer();
        }

        function sendConfigToServer() {
            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(globalConfig)
            })
            .then(res => res.json())
            .then(data => alert(data.message));
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
