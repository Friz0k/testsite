<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НГТУ (НЭТИ) | ДТ-660</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { scrollbar-width: none; }
        ::-webkit-scrollbar { display: none; }
        body { background-color: #050505; color: #fff; }
        .glass-card { background: rgba(18, 18, 20, 0.8); backdrop-filter: blur(12px); border: 1px solid #27272a; border-radius: 16px; }
        .checkbox-custom { accent-color: #7c3aed; width: 22px; height: 22px; cursor: pointer; transition: 0.3s; }
        .item-row { transition: all 0.3s ease; }
        .item-row:hover { background: rgba(255, 255, 255, 0.03); }
        .checked-text { text-decoration: line-through; color: #71717a; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased selection:bg-purple-500 selection:text-white pb-20">
    
    <nav class="glass-card m-4 p-5 sticky top-4 z-50 shadow-2xl flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-black tracking-widest uppercase text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-purple-600">ДТ-660</h1>
            <p class="text-xs text-gray-400 font-mono mt-1">Учебный портал НГТУ</p>
        </div>
        
        <div class="flex items-center gap-4 bg-black/50 p-2 rounded-xl border border-zinc-800">
            <button onclick="changeWeek(-1)" class="p-2 hover:bg-zinc-800 rounded-lg transition text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div class="text-center min-w-[150px]">
                <div class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-0.5">Неделя</div>
                <div id="weekTitle" class="font-bold text-purple-400 font-mono">--.-- - --.--</div>
            </div>
            <button onclick="changeWeek(1)" class="p-2 hover:bg-zinc-800 rounded-lg transition text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
        
        <div id="progressBox" class="text-sm font-mono text-zinc-400">
            Прогресс: <span id="progressCount" class="text-purple-400 font-bold">0%</span>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto px-4 mt-8">
        <div id="contentGrid" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        </div>
    </main>

    <script>
        let db = { weeks: [] };
        let currentIdx = 0;
        const STORAGE_KEY = 'dt660_student_progress';

        function loadProgress() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
        }

        function saveProgress(prog) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(prog));
        }

        function toggleTask(id) {
            let prog = loadProgress();
            prog[id] = !prog[id];
            saveProgress(prog);
            renderWeek();
        }

        function changeWeek(dir) {
            if (db.weeks.length === 0) return;
            let newIdx = currentIdx + dir;
            if (newIdx >= 0 && newIdx < db.weeks.length) {
                currentIdx = newIdx;
                renderWeek();
            }
        }

        function renderColumn(title, items, prog, colorClass, iconHtml) {
            let html = `
            <div class="glass-card p-6 flex flex-col h-full border-t-4 border-t-${colorClass}">
                <div class="flex items-center gap-3 mb-6 pb-4 border-b border-zinc-800">
                    <div class="text-${colorClass}">${iconHtml}</div>
                    <h2 class="text-xl font-bold uppercase tracking-wide">${title}</h2>
                </div>
                <div class="flex-1 space-y-4">`;

            if (!items || items.length === 0) {
                html += `<div class="text-center text-zinc-600 font-mono text-sm py-10">Нет записей</div>`;
            } else {
                items.forEach(item => {
                    let isDone = prog[item.id] === true;
                    let textClass = isDone ? 'checked-text' : 'text-zinc-200';
                    html += `
                    <div class="item-row bg-black/40 p-4 rounded-xl border border-zinc-800/50">
                        <label class="flex items-start gap-4 cursor-pointer">
                            <input type="checkbox" class="checkbox-custom mt-1" ${isDone ? 'checked' : ''} onchange="toggleTask('${item.id}')">
                            <div class="flex-1">
                                <div class="font-bold text-base ${textClass}">${item.title}</div>
                                ${item.text ? `<div class="mt-2 text-sm text-zinc-400 leading-relaxed whitespace-pre-wrap">${item.text}</div>` : ''}
                                ${item.videoUrl ? `<a href="${item.videoUrl}" target="_blank" class="inline-block mt-3 px-4 py-2 bg-purple-600/20 text-purple-400 hover:bg-purple-600 hover:text-white border border-purple-500/30 rounded-lg text-xs font-bold uppercase tracking-wider transition">Смотреть запись</a>` : ''}
                            </div>
                        </label>
                    </div>`;
                });
            }
            html += `</div></div>`;
            return html;
        }

        function renderWeek() {
            let grid = document.getElementById('contentGrid');
            if (db.weeks.length === 0) {
                document.getElementById('weekTitle').innerText = 'Нет данных';
                grid.innerHTML = '<div class="col-span-3 text-center text-zinc-500 py-20 font-mono">Администратор еще не добавил недели.</div>';
                return;
            }

            let w = db.weeks[currentIdx];
            document.getElementById('weekTitle').innerText = w.date;

            let prog = loadProgress();
            
            let totalTasks = (w.webinars?.length || 0) + (w.tasks?.length || 0) + (w.works?.length || 0);
            let doneTasks = 0;
            
            [...(w.webinars||[]), ...(w.tasks||[]), ...(w.works||[])].forEach(i => {
                if (prog[i.id]) doneTasks++;
            });
            
            let perc = totalTasks === 0 ? 0 : Math.round((doneTasks / totalTasks) * 100);
            document.getElementById('progressCount').innerText = perc + '%';

            let iconWeb = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>`;
            let iconTask = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>`;
            let iconWork = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>`;

            grid.innerHTML = 
                renderColumn('Вебинары (Записи)', w.webinars, prog, 'purple-500', iconWeb) +
                renderColumn('Задания (Выполнить)', w.tasks, prog, 'pink-500', iconTask) +
                renderColumn('Работы', w.works, prog, 'indigo-500', iconWork);
        }

        async function init() {
            let res = await fetch('/api/ntsu');
            if (res.ok) {
                db = await res.json();
                if (db.weeks && db.weeks.length > 0) {
                    currentIdx = db.weeks.length - 1;
                }
                renderWeek();
            }
        }
        init();
    </script>
</body>
</html>
