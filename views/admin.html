<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель Frizworld</title>
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #121214;
            --border-color: #27272a;
            --accent-color: #7c3aed;
            --accent-hover: #6d28d9;
            --success-color: #22c55e;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 30px 20px;
        }

        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 35px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .admin-section {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        h2 {
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            font-weight: 600;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
        }

        textarea#codeEditor {
            height: 450px;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            color: #c084fc;
            background-color: #050507;
            font-size: 13px;
            line-height: 1.5;
        }

        button {
            background-color: var(--accent-color);
            color: var(--text-main);
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .btn-success:hover {
            background-color: #16a34a;
        }

        pre {
            background-color: #050507;
            color: var(--success-color);
            padding: 18px;
            border-radius: 8px;
            height: 350px;
            overflow-y: auto;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 13px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Панель управления Frizworld</h1>
        
        <div class="admin-section">
            <h2>Глобальные переменные</h2>
            <form id="settingsForm">
                <div class="form-group">
                    <label>ВЕБХУК LSSD</label>
                    <input type="text" id="webhook_lssd" name="webhook_lssd">
                </div>
                <div class="form-group">
                    <label>ВЕБХУК LSPD</label>
                    <input type="text" id="webhook_lspd" name="webhook_lspd">
                </div>
                <div class="form-group">
                    <label>ВЕБХУК GOV</label>
                    <input type="text" id="webhook_gov" name="webhook_gov">
                </div>
                <div class="form-group">
                    <label>ВЕБХУК CID</label>
                    <input type="text" id="webhook_cid" name="webhook_cid">
                </div>
                <div class="form-group">
                    <label>ВЕБХУК FIB</label>
                    <input type="text" id="webhook_fib" name="webhook_fib">
                </div>
                <div class="form-group">
                    <label>ID РОЛЕЙ ДЛЯ УПОМИНАНИЯ (ЧЕРЕЗ ЗАПЯТУЮ)</label>
                    <input type="text" id="role_ids" name="role_ids">
                </div>
                <div class="form-group">
                    <label>БАЛЛОВАЯ СИСТЕМА (НАСТРОЙКИ ТЕКСТОМ / JSON)</label>
                    <textarea id="points_system" name="points_system" rows="6"></textarea>
                </div>
                <button type="button" onclick="saveSettings()">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
            </form>
        </div>

        <div class="admin-section">
            <h2>Управление иллюстрацией</h2>
            <div class="form-group">
                <label>ССЫЛКА НА ИЛЛЮСТРАЦИЮ</label>
                <input type="text" id="illustrationUrl" placeholder="Вставьте прямую ссылку на фото">
            </div>
            <button type="button" onclick="saveIllustration()">СОХРАНИТЬ ИЛЛЮСТРАЦИЮ</button>
        </div>

        <div class="admin-section">
            <h2>Логи сервера в реальном времени</h2>
            <button type="button" onclick="fetchLogs()" style="margin-bottom: 15px;">ОБНОВИТЬ ЛОГИ</button>
            <pre id="serverLogs">Загрузка логов...</pre>
        </div>

        <div class="admin-section">
            <h2>Редактор кода проекта</h2>
            <div class="form-group">
                <label>ВЫБЕРИТЕ ФАЙЛ ДЛЯ РЕДАКТИРОВАНИЯ</label>
                <select id="fileSelect" onchange="loadFileCode()">
                    <option value="server.js">server.js</option>
                    <option value="public/index.html">Главная страница (public/index.html)</option>
                    <option value="public/admin.html">Админ-панель (public/admin.html)</option>
                </select>
            </div>
            <textarea id="codeEditor"></textarea>
            <button type="button" class="btn-success" onclick="saveFileCode()">СОХРАНИТЬ И ПРИМЕНИТЬ КОД</button>
        </div>
    </div>

    <script>
    function loadSettings() {
        fetch('/api/settings')
            .then(res => res.json())
            .then(data => {
                document.getElementById('webhook_lssd').value = data.webhook_lssd || '';
                document.getElementById('webhook_lspd').value = data.webhook_lspd || '';
                document.getElementById('webhook_gov').value = data.webhook_gov || '';
                document.getElementById('webhook_cid').value = data.webhook_cid || '';
                document.getElementById('webhook_fib').value = data.webhook_fib || '';
                document.getElementById('role_ids').value = data.role_ids || '';
                document.getElementById('points_system').value = data.points_system || '';
                if(data.illustrationUrl) {
                    document.getElementById('illustrationUrl').value = data.illustrationUrl;
                }
            })
            .catch(err => console.error(err));
    }
    loadSettings();

    function saveSettings() {
        let body = {
            webhook_lssd: document.getElementById('webhook_lssd').value,
            webhook_lspd: document.getElementById('webhook_lspd').value,
            webhook_gov: document.getElementById('webhook_gov').value,
            webhook_cid: document.getElementById('webhook_cid').value,
            webhook_fib: document.getElementById('webhook_fib').value,
            role_ids: document.getElementById('role_ids').value,
            points_system: document.getElementById('points_system').value,
            illustrationUrl: document.getElementById('illustrationUrl').value
        };
        fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert('Настройки успешно сохранены!');
            } else {
                alert('Ошибка при сохранении настроек');
            }
        })
        .catch(err => alert('Ошибка соединения'));
    }

    function saveIllustration() {
        let url = document.getElementById('illustrationUrl').value;
        localStorage.setItem('site_illustration', url);
        saveSettings();
    }

    function fetchLogs() {
        fetch('/api/logs')
            .then(res => res.json())
            .then(data => {
                document.getElementById('serverLogs').innerText = data.logs || 'Логов пока нет';
            })
            .catch(err => {
                document.getElementById('serverLogs').innerText = 'Ошибка загрузки логов';
            });
    }
    fetchLogs();
    setInterval(fetchLogs, 10000);

    function loadFileCode() {
        let file = document.getElementById('fileSelect').value;
        fetch('/api/file?path=' + encodeURIComponent(file))
            .then(res => res.json())
            .then(data => {
                document.getElementById('codeEditor').value = data.content || '';
            })
            .catch(err => alert('Ошибка загрузки файла'));
    }
    loadFileCode();

    function saveFileCode() {
        let file = document.getElementById('fileSelect').value;
        let content = document.getElementById('codeEditor').value;
        fetch('/api/file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filePath: file, content: content })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert('Код успешно сохранен и применен на сервере!');
            } else {
                alert('Ошибка при сохранении: ' + (data.error || 'Неизвестная ошибка'));
            }
        })
        .catch(err => alert('Ошибка соединения с сервером'));
    }
    </script>
</body>
</html>
