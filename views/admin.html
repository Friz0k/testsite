<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frizworld Admin Panel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥶</text></svg>">
    <style>
        :root {
            --bg-color: #09090b;
            --sidebar-bg: #121214;
            --panel-bg: #18181b;
            --border-color: #27272a;
            --accent-color: #7c3aed;
            --accent-hover: #6d28d9;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --input-bg: #09090b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }

        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 0; z-index: 100; }
        .sidebar h2 { color: var(--accent-color); font-size: 20px; padding: 0 20px 20px 20px; border-bottom: 1px solid var(--border-color); text-align: center; margin-bottom: 10px; }
        .nav-category { padding: 10px 20px 5px; font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; font-weight: bold; }
        .nav-links { list-style: none; padding: 0 10px; flex-grow: 1; overflow-y: auto; }
        .nav-links li { padding: 12px 15px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .nav-links li:hover { background-color: rgba(109, 40, 217, 0.1); color: var(--text-main); }
        .nav-links li.active { background-color: var(--accent-color); color: #ffffff; }

        .logout-btn { margin: 10px 20px; padding: 10px; background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: center; }
        .logout-btn:hover { background: var(--danger-color); color: #fff; }

        .content-area { flex-grow: 1; padding: 20px 40px; overflow-y: auto; }
        .tab-content { display: none; max-width: 1000px; margin: 0 auto; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .admin-section { background-color: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); margin-bottom: 20px; }
        h3 { margin-bottom: 20px; font-size: 22px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; color: var(--text-main); }
        h4 { margin: 25px 0 15px; color: var(--accent-color); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: 1 / -1; }

        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; }
        input[type="text"], input[type="number"], input[type="file"], select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background-color: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-color); }

        textarea#codeEditor { height: 400px; font-family: monospace; color: #c084fc; background-color: #050507; white-space: pre; }

        button { background-color: var(--accent-color); color: #fff; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-sm { padding: 8px 15px; font-size: 12px; margin-top: 5px; }

        .btn-group { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; }

        pre.logs-view { background-color: #050507; color: #22c55e; padding: 15px; border-radius: 8px; height: 500px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid var(--border-color); white-space: pre-wrap; word-wrap: break-word; }
        .preview-img { max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px; object-fit: cover; }

        .q-card { background: #27272a; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #3f3f46; position: relative; }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; color: var(--text-main); font-size: 16px; }
        .q-settings { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; background: #18181b; padding: 10px; border-radius: 6px; }
        .q-settings select, .q-settings input { margin-bottom: 0; padding: 8px; }
        .q-opt { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #18181b; padding: 10px; border-radius: 6px; }
        .q-opt input[type="text"] { margin-bottom: 0; flex-grow: 1; }
        .q-opt input[type="radio"], .q-opt input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent-color); }
        .opt-label { font-size: 12px; color: var(--text-muted); cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <h2>Frizworld Admin</h2>
        
        <div class="nav-category">Сайт</div>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('projects', this)">📦 Проекты</li>
            <li onclick="switchTab('illustration', this)">🎨 Арт на главной</li>
            <li onclick="switchTab('logs', this)">📊 Логи сервера</li>
            <li onclick="switchTab('code', this)">💻 Редактор кода</li>
        </ul>

        <div class="nav-category">Системы</div>
        <ul class="nav-links">
            <li onclick="switchTab('faction_manager', this)">💼 Управление фракциями</li>
        </ul>

        <button class="logout-btn" onclick="window.location.href='/logout'">Выйти</button>
    </div>

    <div class="content-area">
        
        <div id="projects" class="tab-content active">
            <div class="admin-section">
                <h3>Карточки проектов</h3>
                <label>Выберите проект</label>
                <select id="projectSelect" onchange="selectProject()">
                    <option value="">➕ Создать новый проект</option>
                </select>
                
                <div class="form-grid">
                    <div>
                        <label>Название проекта</label>
                        <input type="text" id="projTitle" placeholder="Например: SA LSSD">
                        <label>Ссылка / Путь</label>
                        <input type="text" id="projPath" placeholder="/systems/lssd/lssd.SA.html">
                    </div>
                    <div>
                        <label>Изображение</label>
                        <img id="projImgPreview" class="preview-img" src="" alt="Превью" style="display:none;">
                        <input type="file" id="projImageFile" accept="image/*">
                    </div>
                    <div class="full-width">
                        <label>Краткое описание (на главную)</label>
                        <textarea id="projShortDesc" rows="2"></textarea>
                    </div>
                    <div class="full-width">
                        <label>Полное описание</label>
                        <textarea id="projFullDesc" rows="4"></textarea>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button type="button" onclick="saveProjectWithImage()">💾 Сохранить проект</button>
                    <button type="button" class="btn-danger" id="deleteBtn" onclick="deleteProject()" style="display: none;">🗑 Удалить</button>
                </div>
            </div>
        </div>

        <div id="illustration" class="tab-content">
            <div class="admin-section">
                <h3>Арт на главной странице</h3>
                <div class="form-grid">
                    <div>
                        <label>Текущий арт</label>
                        <img id="currentIllustration" class="preview-img" src="" style="display:none;">
                    </div>
                    <div>
                        <label>Загрузить новый</label>
                        <input type="file" id="illustrationFile" accept="image/*">
                        <button type="button" onclick="uploadIllustration()">Загрузить и применить</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="logs" class="tab-content">
            <div class="admin-section">
                <h3>Мониторинг сервера</h3>
                <div class="form-grid full-width" style="margin-bottom: 15px; align-items: end;">
                    <div>
                        <label>Тип логов</label>
                        <select id="logTypeSelect" onchange="fetchLogs()">
                            <option value="visits">👀 Логи визитов (access.log)</option>
                            <option value="errors">❌ Логи ошибок (error.log)</option>
                            <option value="app">📋 Логи приложения (app.log)</option>
                        </select>
                    </div>
                    <div class="btn-group">
                        <button type="button" onclick="fetchLogs()">🔄 Обновить</button>
                        <button type="button" id="autoRefreshBtn" onclick="toggleAutoRefresh()" class="btn-success">Автообновление: ВЫКЛ</button>
                    </div>
                </div>
                <pre id="serverLogs" class="logs-view">Загрузка логов...</pre>
            </div>
        </div>

        <div id="code" class="tab-content">
            <div class="admin-section">
                <h3>Встроенный редактор кода</h3>
                <label>Файл для редактирования (папка public)</label>
                <select id="fileSelect" onchange="loadFileCode()"></select>
                <textarea id="codeEditor" spellcheck="false"></textarea>
                <div class="btn-group">
                    <button type="button" class="btn-success" onclick="saveFileCode()">💾 Сохранить изменения</button>
                </div>
            </div>
        </div>

        <div id="faction_manager" class="tab-content">
            <div class="admin-section">
                <h3>Модуль настройки фракций</h3>
                <label>Выберите фракцию/проект для настройки:</label>
                <select id="factionSelector" onchange="loadFactionUI()" style="font-size: 16px; font-weight: bold; padding: 15px;">
                    <option value="fib">🦅 FIB & CID (Федеральное Бюро)</option>
                    <option value="lssd">🤠 LSSD (Департамент Шерифа)</option>
                    <option value="lspd">🚓 LSPD (Полицейский Департамент)</option>
                    <option value="gov">⚖️ GOV (Правительство / Адвокаты)</option>
                    <option value="ems">🚑 EMS (Медицинская служба)</option>
                    <option value="deadly">💀 DEADLY (Семья)</option>
                </select>

                <div id="faction-webhooks"></div>
                <div id="faction-roles"></div>

                <div id="faction-tests" style="display: none; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                    <h4>Настройка тестирования</h4>
                    <div style="max-width: 300px;">
                        <label>Проходной балл (минимум для сдачи):</label>
                        <input type="number" id="test-passing-score" value="0">
                    </div>
                    
                    <div id="questions-list" style="margin-top: 20px;"></div>
                    
                    <button type="button" class="btn-success" onclick="addQuestion()" style="margin-top: 10px;">➕ Добавить вопрос</button>
                </div>

                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                    <button type="button" onclick="saveFactionSettings()" style="width: 100%; padding: 15px; font-size: 16px;">💾 СОХРАНИТЬ ВСЕ НАСТРОЙКИ</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-links li').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
            if (tabId === 'logs') fetchLogs();
            if (tabId === 'faction_manager' && !currentFaction) loadFactionUI();
        }

        async function apiCall(url, options = {}) {
            try {
                const res = await fetch(url, options);
                if (res.status === 403) {
                    alert('Сессия истекла. Авторизуйтесь заново.');
                    window.location.href = '/login';
                    return null;
                }
                if (!res.ok) throw new Error(`Ошибка ${res.status}`);
                return await res.json();
            } catch (err) {
                console.error(err); alert('Сбой запроса: ' + err.message); return null;
            }
        }

        let allProjects = []; let currentProjImageUrl = '';
        async function loadProjects() {
            const data = await apiCall('/api/projects');
            if (!data) return;
            allProjects = data;
            const select = document.getElementById('projectSelect');
            select.innerHTML = '<option value="">➕ Создать новый проект</option>';
            allProjects.forEach((p, index) => { select.innerHTML += `<option value="${index}">${p.title || 'Проект ' + (index + 1)}</option>`; });
            selectProject();
        }
        function selectProject() {
            const idx = document.getElementById('projectSelect').value;
            const img = document.getElementById('projImgPreview');
            if (idx === "") {
                document.getElementById('projTitle').value = ''; document.getElementById('projPath').value = ''; document.getElementById('projShortDesc').value = ''; document.getElementById('projFullDesc').value = ''; currentProjImageUrl = '';
                img.style.display = 'none'; document.getElementById('deleteBtn').style.display = 'none';
            } else {
                const p = allProjects[idx];
                document.getElementById('projTitle').value = p.title || ''; document.getElementById('projPath').value = p.path || ''; document.getElementById('projShortDesc').value = p.shortDesc || ''; document.getElementById('projFullDesc').value = p.fullDesc || ''; currentProjImageUrl = p.imageUrl || '';
                if (currentProjImageUrl) { img.src = currentProjImageUrl; img.style.display = 'block'; } else { img.style.display = 'none'; }
                document.getElementById('deleteBtn').style.display = 'inline-block';
            }
        }
        function saveProjectWithImage() {
            const fileInput = document.getElementById('projImageFile');
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const data = await apiCall('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: e.target.result }) });
                    if (data && data.success) { currentProjImageUrl = data.url; saveProjectData(); }
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else saveProjectData();
        }
        async function saveProjectData() {
            const idx = document.getElementById('projectSelect').value;
            const projData = { title: document.getElementById('projTitle').value, path: document.getElementById('projPath').value, shortDesc: document.getElementById('projShortDesc').value, fullDesc: document.getElementById('projFullDesc').value, imageUrl: currentProjImageUrl };
            if (idx === "") allProjects.push(projData); else allProjects[idx] = projData;
            const data = await apiCall('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(allProjects) });
            if (data && data.success) { alert('Проект сохранен!'); loadProjects(); }
        }
        async function deleteProject() {
            const idx = document.getElementById('projectSelect').value;
            if (idx === "" || !confirm('Точно удалить проект?')) return;
            allProjects.splice(idx, 1);
            const data = await apiCall('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(allProjects) });
            if (data && data.success) { document.getElementById('projectSelect').value = ""; loadProjects(); }
        }
        function uploadIllustration() {
            const fileInput = document.getElementById('illustrationFile');
            if (fileInput.files.length === 0) return alert('Выберите файл!');
            const reader = new FileReader();
            reader.onload = async (e) => {
                const upRes = await apiCall('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: e.target.result }) });
                if (upRes && upRes.success) {
                    globalConfig.illustrationUrl = upRes.url;
                    await apiCall('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(globalConfig) });
                    document.getElementById('currentIllustration').src = upRes.url; document.getElementById('currentIllustration').style.display = 'block'; alert('Арт обновлен!');
                }
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        let refreshInterval = null;
        async function fetchLogs() { const type = document.getElementById('logTypeSelect').value; const data = await apiCall(`/api/logs?type=${type}`); if (data) document.getElementById('serverLogs').innerText = data.logs || 'Пусто...'; }
        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');
            if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; btn.innerText = 'Автообновление: ВЫКЛ'; btn.style.backgroundColor = 'var(--accent-color)'; } 
            else { fetchLogs(); refreshInterval = setInterval(fetchLogs, 3000); btn.innerText = 'Автообновление: ВКЛ'; btn.style.backgroundColor = 'var(--success-color)'; }
        }

        async function loadFileList() { const files = await apiCall('/api/list-files'); if (!files) return; const select = document.getElementById('fileSelect'); select.innerHTML = '<option value="">-- Выберите файл --</option>'; files.forEach(f => { select.innerHTML += `<option value="${f}">${f}</option>`; }); }
        async function loadFileCode() { const file = document.getElementById('fileSelect').value; if (!file) { document.getElementById('codeEditor').value = ''; return; } const data = await apiCall('/api/file?path=' + encodeURIComponent(file)); if (data) document.getElementById('codeEditor').value = data.content || ''; }
        async function saveFileCode() {
            const file = document.getElementById('fileSelect').value; const content = document.getElementById('codeEditor').value; if (!file) return alert('Файл не выбран!');
            const data = await apiCall('/api/file', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filePath: file, content: content }) });
            if (data && data.success) alert('Код сохранен!');
        }

        let globalConfig = {};
        let currentFaction = '';
        let unifiedQuestions = [];

        const factionSchemas = {
            fib: { webhooks: { main: "Переаттестация FIB", cid_evidence: "Улики CID" }, roles: { ping: "Пинг FIB", cid_evidence: "Пинг CID" }, hasTest: true },
            lssd: { webhooks: { report: "Отчеты", promotion: "Повышения", badge: "Жетоны", cadet: "Кадеты", test: "Тесты" }, roles: { iid: "Роли IID", sa: "Роли SA" }, hasTest: true },
            lspd: { webhooks: { application: "Заявления", badge: "Жетоны", cadet: "Отчеты кадетов", test: "Тесты" }, roles: { application: "Заявления", badge: "Жетоны", cadet: "Кадеты", test: "Тесты" }, hasTest: true },
            gov: { webhooks: { test: "Тест адвокатов" }, roles: { test: "Пинги" }, hasTest: true },
            ems: { webhooks: { main: "Основной" }, roles: { main: "Пинги" }, hasTest: false },
            deadly: { webhooks: { application: "Заявки в семью" }, roles: { ping: "Пинги" }, hasTest: false }
        };

        async function initAdmin() {
            const data = await apiCall('/api/settings');
            if (data) {
                globalConfig = data;
                if (data.illustrationUrl) {
                    document.getElementById('currentIllustration').src = data.illustrationUrl;
                    document.getElementById('currentIllustration').style.display = 'block';
                }
                loadFactionUI();
            }
            loadProjects();
            loadFileList();
            fetchLogs();
        }

        function loadFactionUI() {
            currentFaction = document.getElementById('factionSelector').value;
            const schema = factionSchemas[currentFaction];
            const config = globalConfig[currentFaction] || { webhooks: {}, roles: {} };

            let whHtml = '<h4>Вебхуки (Discord)</h4><div class="form-grid">';
            for (let [key, label] of Object.entries(schema.webhooks)) {
                whHtml += `<div><label>${label}</label><input type="text" id="wh_${key}" value="${config.webhooks?.[key] || ''}" placeholder="https://discord.com/api/webhooks/..."></div>`;
            }
            whHtml += '</div>';
            document.getElementById('faction-webhooks').innerHTML = whHtml;

            let rlHtml = '<h4>Роли (Упоминания ID)</h4><div class="form-grid">';
            for (let [key, label] of Object.entries(schema.roles)) {
                rlHtml += `<div><label>${label}</label><input type="text" id="rl_${key}" value="${config.roles?.[key] || ''}" placeholder="123456789012345678"></div>`;
            }
            rlHtml += '</div>';
            document.getElementById('faction-roles').innerHTML = rlHtml;

            if (schema.hasTest) {
                document.getElementById('faction-tests').style.display = 'block';
                
                let passingScore = 0;
                let rawQuestions = [];
                
                if (currentFaction === 'fib') {
                    passingScore = config.testSettings?.passingScore || 0;
                    rawQuestions = config.testSettings?.questions || [];
                } else if (currentFaction === 'lssd') {
                    passingScore = config.testPassingScore || 0;
                    rawQuestions = config.testQuestions || [];
                } else if (currentFaction === 'lspd') {
                    passingScore = config.testPassingScore || 0;
                    rawQuestions = config.testQuestions || [];
                } else if (currentFaction === 'gov') {
                    passingScore = config.testSettings?.passingScore || 0;
                    rawQuestions = config.testSettings?.questions || [];
                }
                
                document.getElementById('test-passing-score').value = passingScore;

                unifiedQuestions = rawQuestions.map(q => {
                    let uq = { text: '', options: [], type: 'single', points: 1, isBonus: false };
                    if (currentFaction === 'fib') {
                        uq.text = q.text || q.question || '';
                        uq.options = (q.options || []).map(o => ({ text: o, isCorrect: o === q.correctAnswer }));
                    } else if (currentFaction === 'lssd') {
                        uq.text = q.question || '';
                        uq.options = (q.options || []).map((o, i) => ({ text: o, isCorrect: i === q.correctIndex }));
                    } else if (currentFaction === 'lspd') {
                        uq.text = q.question || '';
                        const corrects = q.correct || [];
                        uq.options = (q.options || []).map(o => ({ text: o, isCorrect: corrects.includes(o) }));
                        uq.type = corrects.length > 1 ? 'multiple' : 'single';
                    } else if (currentFaction === 'gov') {
                        uq.text = q.question || '';
                        uq.type = q.type || 'single';
                        uq.points = q.points || 1;
                        uq.isBonus = q.isBonus || false;
                        uq.options = (q.options || []).map(o => ({ text: o.text || '', isCorrect: !!o.correct }));
                    }
                    return uq;
                });
                
                renderQuestions();
            } else {
                document.getElementById('faction-tests').style.display = 'none';
            }
        }

        function renderQuestions() {
            const list = document.getElementById('questions-list');
            list.innerHTML = '';
            unifiedQuestions.forEach((q, qIndex) => {
                let html = `<div class="q-card">
                    <div class="q-header">
                        <span>Вопрос ${qIndex + 1}</span>
                        <button class="btn-danger btn-sm" onclick="removeQuestion(${qIndex})">🗑 Удалить вопрос</button>
                    </div>
                    <input type="text" class="q-text" value="${q.text.replace(/"/g, '&quot;')}" placeholder="Текст вопроса...">
                `;

                if (currentFaction === 'gov') {
                    html += `
                    <div class="q-settings">
                        <div><label>Тип вопроса:</label>
                        <select class="q-type">
                            <option value="single" ${q.type==='single'?'selected':''}>Один вариант</option>
                            <option value="multiple" ${q.type==='multiple'?'selected':''}>Несколько вариантов</option>
                            <option value="text" ${q.type==='text'?'selected':''}>Развернутый ответ</option>
                        </select></div>
                        <div><label>Баллы:</label><input type="number" class="q-points" value="${q.points}" min="1" style="width:80px"></div>
                        <div><label style="margin-top:10px;"><input type="checkbox" class="q-bonus" ${q.isBonus?'checked':''}> Бонусный вопрос</label></div>
                    </div>`;
                } else if (currentFaction === 'lspd') {
                    html += `
                    <div class="q-settings">
                        <div><label>Тип вопроса:</label>
                        <select class="q-type">
                            <option value="single" ${q.type==='single'?'selected':''}>Один вариант</option>
                            <option value="multiple" ${q.type==='multiple'?'selected':''}>Несколько вариантов</option>
                        </select></div>
                    </div>`;
                }

                if (q.type !== 'text') {
                    html += `<div class="q-options-container" style="margin-top:10px;">
                                <label style="margin-bottom: 5px;">Варианты ответа (отметьте правильные):</label>`;
                    q.options.forEach((opt, oIndex) => {
                        const inputType = (q.type === 'multiple' || (currentFaction === 'lspd' && q.type === 'multiple')) ? 'checkbox' : 'radio';
                        html += `<div class="q-opt">
                            <input type="${inputType}" name="correct_${qIndex}" class="opt-correct" ${opt.isCorrect ? 'checked' : ''} title="Правильный ответ">
                            <input type="text" class="opt-text" value="${opt.text.replace(/"/g, '&quot;')}" placeholder="Вариант ответа">
                            <button class="btn-danger btn-sm" onclick="removeOpt(${qIndex}, ${oIndex})">❌</button>
                        </div>`;
                    });
                    html += `<button class="btn-success btn-sm" onclick="addOpt(${qIndex})">+ Добавить вариант</button>`;
                    html += `</div>`;
                }

                html += `</div>`;
                list.insertAdjacentHTML('beforeend', html);
            });
        }

        function syncDOMToState() {
            const qCards = document.querySelectorAll('.q-card');
            unifiedQuestions = Array.from(qCards).map((card, qIndex) => {
                const q = { options: [] };
                q.text = card.querySelector('.q-text').value;
                
                if (currentFaction === 'gov') {
                    q.type = card.querySelector('.q-type').value;
                    q.points = parseInt(card.querySelector('.q-points').value) || 1;
                    q.isBonus = card.querySelector('.q-bonus').checked;
                } else if (currentFaction === 'lspd') {
                    q.type = card.querySelector('.q-type')?.value || 'single';
                } else {
                    q.type = 'single';
                }

                if (q.type !== 'text') {
                    const optDivs = card.querySelectorAll('.q-opt');
                    optDivs.forEach(optDiv => {
                        q.options.push({
                            text: optDiv.querySelector('.opt-text').value,
                            isCorrect: optDiv.querySelector('.opt-correct').checked
                        });
                    });
                }
                return q;
            });
        }

        function addQuestion() {
            syncDOMToState();
            unifiedQuestions.push({ text: '', type: 'single', points: 1, isBonus: false, options: [{text: '', isCorrect: false}, {text: '', isCorrect: false}] });
            renderQuestions();
        }

        function removeQuestion(idx) {
            if(!confirm('Удалить этот вопрос?')) return;
            syncDOMToState();
            unifiedQuestions.splice(idx, 1);
            renderQuestions();
        }

        function addOpt(qIdx) {
            syncDOMToState();
            unifiedQuestions[qIdx].options.push({ text: '', isCorrect: false });
            renderQuestions();
        }

        function removeOpt(qIdx, oIdx) {
            syncDOMToState();
            unifiedQuestions[qIdx].options.splice(oIdx, 1);
            renderQuestions();
        }

        async function saveFactionSettings() {
            const schema = factionSchemas[currentFaction];
            if (!globalConfig[currentFaction]) globalConfig[currentFaction] = { webhooks: {}, roles: {} };
            const config = globalConfig[currentFaction];

            for (let key of Object.keys(schema.webhooks)) {
                config.webhooks[key] = document.getElementById(`wh_${key}`).value.trim();
            }
            for (let key of Object.keys(schema.roles)) {
                config.roles[key] = document.getElementById(`rl_${key}`).value.trim();
            }

            if (schema.hasTest) {
                syncDOMToState();
                const passingScore = parseInt(document.getElementById('test-passing-score').value) || 0;
                
                const processedQuestions = unifiedQuestions.map((uq, idx) => {
                    if (currentFaction === 'fib') {
                        const correctOpt = uq.options.find(o => o.isCorrect);
                        return {
                            text: uq.text,
                            options: uq.options.map(o => o.text),
                            correctAnswer: correctOpt ? correctOpt.text : (uq.options[0]?.text || '')
                        };
                    } else if (currentFaction === 'lssd') {
                        return {
                            id: idx + 1,
                            question: uq.text,
                            options: uq.options.map(o => o.text),
                            correctIndex: Math.max(0, uq.options.findIndex(o => o.isCorrect))
                        };
                    } else if (currentFaction === 'lspd') {
                        return {
                            id: idx + 1,
                            question: uq.text,
                            options: uq.options.map(o => o.text),
                            correct: uq.options.filter(o => o.isCorrect).map(o => o.text)
                        };
                    } else if (currentFaction === 'gov') {
                        return {
                            id: idx + 1,
                            question: uq.text,
                            type: uq.type,
                            points: uq.points,
                            isBonus: uq.isBonus,
                            options: uq.type === 'text' ? [] : uq.options.map(o => ({ text: o.text, correct: o.isCorrect }))
                        };
                    }
                });

                if (currentFaction === 'fib') {
                    if (!config.testSettings) config.testSettings = {};
                    config.testSettings.passingScore = passingScore;
                    config.testSettings.questions = processedQuestions;
                } else if (currentFaction === 'lssd' || currentFaction === 'lspd') {
                    config.testPassingScore = passingScore;
                    config.testQuestions = processedQuestions;
                } else if (currentFaction === 'gov') {
                    if (!config.testSettings) config.testSettings = {};
                    config.testSettings.passingScore = passingScore;
                    config.testSettings.questions = processedQuestions;
                }
            }

            const res = await apiCall('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(globalConfig)
            });

            if (res && res.success) {
                alert(`Настройки фракции ${currentFaction.toUpperCase()} успешно сохранены!`);
                loadFactionUI();
            }
        }

        initAdmin();
    </script>
</body>
</html>
