<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrizWorld | Панель управления</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050508;
            --sidebar-bg: #0d0d12;
            --panel-bg: #13131a;
            --border: rgba(138, 43, 226, 0.25);
            --border-hover: #8a2be2;
            --accent: #8a2be2;
            --accent-light: #b026ff;
            --text: #ffffff;
            --text-muted: #a0a0ab;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 25px 15px;
            flex-shrink: 0;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .brand span { color: var(--accent-light); }

        .nav-links {
            list-style: none;
            margin-top: 20px;
            flex-grow: 1;
        }

        .nav-links li {
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .nav-links li:hover {
            background-color: rgba(138, 43, 226, 0.1);
            color: var(--text);
            border-color: rgba(138, 43, 226, 0.2);
        }

        .nav-links li.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.35);
        }

        /* Content Area */
        .content-area {
            flex-grow: 1;
            padding: 35px 40px;
            overflow-y: auto;
        }

        .tab-content {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content.active { display: block; }

        .admin-section {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        h3 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h3 i { color: var(--accent-light); }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-dark);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-light);
            box-shadow: 0 0 12px rgba(176, 38, 255, 0.2);
        }

        textarea { resize: vertical; min-height: 100px; }

        textarea#codeEditor {
            height: 480px;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #d8b4fe;
            background-color: #07070a;
            font-size: 13px;
            line-height: 1.5;
            tab-size: 4;
        }

        .file-upload-box {
            border: 2px dashed var(--border);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            background: rgba(138, 43, 226, 0.03);
            transition: border-color 0.3s;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .file-upload-box:hover { border-color: var(--accent-light); }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: var(--text);
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.25);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(176, 38, 255, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.25);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.25);
        }

        .btn-group { display: flex; gap: 15px; margin-top: 10px; }

        pre#serverLogs {
            background-color: #050508;
            color: #4ade80;
            padding: 20px;
            border-radius: 12px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid var(--border);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .preview-img {
            max-width: 260px;
            max-height: 160px;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid var(--border);
            display: block;
            object-fit: cover;
        }

        /* Toast Notifications */
        #toastContainer {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--panel-bg);
            border-left: 4px solid var(--accent-light);
            color: #fff;
            padding: 14px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            min-width: 280px;
            animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .toast.success { border-left-color: var(--success); }
        .toast.danger { border-left-color: var(--danger); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <i class="fas fa-shield-halved"></i>
            Friz<span>World</span>
        </div>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('projects', this)">
                <i class="fas fa-cubes"></i> Проекты
            </li>
            <li onclick="switchTab('illustration', this)">
                <i class="fas fa-image"></i> Иллюстрация
            </li>
            <li onclick="switchTab('logs', this)">
                <i class="fas fa-terminal"></i> Логи сервера
            </li>
            <li onclick="switchTab('code', this)">
                <i class="fas fa-code"></i> Редактор кода
            </li>
            <li onclick="switchTab('contacts', this)">
                <i class="fas fa-sliders"></i> Контакты & Настройки
            </li>
        </ul>
    </div>

    <div class="content-area">

        <div id="projects" class="tab-content active">
            <div class="admin-section">
                <div class="section-header">
                    <h3><i class="fas fa-folder-plus"></i> Управление проектами</h3>
                </div>

                <div class="form-group">
                    <label>Выберите проект для редактирования</label>
                    <select id="projectSelect" onchange="selectProject()">
                        <option value="">-- Создать новый проект --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Название проекта</label>
                    <input type="text" id="projTitle" placeholder="Например: SA LSSD">
                </div>

                <div class="form-group">
                    <label>Путь / Ссылка для тестирования</label>
                    <input type="text" id="projPath" placeholder="Например: /systems/sa_lssd/">
                </div>

                <div class="form-group">
                    <label>Фото / Иконка проекта</label>
                    <div class="file-upload-box">
                        <input type="file" id="projImageFile" accept="image/*" style="color: #fff;">
                    </div>
                    <img id="projImgPreview" class="preview-img" src="" alt="Превью" style="display: none;">
                </div>

                <div class="form-group">
                    <label>Краткое описание (для карточки)</label>
                    <textarea id="projShortDesc" rows="2" placeholder="Краткое описание системы..."></textarea>
                </div>

                <div class="form-group">
                    <label>Полное описание (для модального окна)</label>
                    <textarea id="projFullDesc" rows="4" placeholder="Подробное описание системы и её возможностей..."></textarea>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn" onclick="saveProjectWithImage()">
                        <i class="fas fa-save"></i> Сохранить проект
                    </button>
                    <button type="button" class="btn btn-danger" id="deleteBtn" onclick="deleteProject()" style="display: none;">
                        <i class="fas fa-trash"></i> Удалить проект
                    </button>
                </div>
            </div>
        </div>

        <div id="illustration" class="tab-content">
            <div class="admin-section">
                <div class="section-header">
                    <h3><i class="fas fa-paint-brush"></i> Иллюстрация сайта (Арт)</h3>
                </div>

                <div class="form-group">
                    <label>Текущий Арт</label>
                    <img id="currentIllustration" class="preview-img" src="" alt="Арт отсутствует" style="display: none;">
                </div>

                <div class="form-group">
                    <label>Загрузить новый арт</label>
                    <div class="file-upload-box">
                        <input type="file" id="illustrationFile" accept="image/*" style="color: #fff;">
                    </div>
                </div>

                <button type="button" class="btn" onclick="uploadIllustration()">
                    <i class="fas fa-upload"></i> Загрузить и обновить Арт
                </button>
            </div>
        </div>

        <div id="logs" class="tab-content">
            <div class="admin-section">
                <div class="section-header">
                    <h3><i class="fas fa-server"></i> Логи PM2 сервера</h3>
                    <button type="button" class="btn" onclick="fetchLogs()">
                        <i class="fas fa-rotate"></i> Обновить логи
                    </button>
                </div>
                <pre id="serverLogs">Загрузка логов...</pre>
            </div>
        </div>

        <div id="code" class="tab-content">
            <div class="admin-section">
                <div class="section-header">
                    <h3><i class="fas fa-code"></i> Редактор кода проекта</h3>
                </div>

                <div class="form-group">
                    <label>Выберите файл проекта</label>
                    <select id="fileSelect" onchange="loadFileCode()"></select>
                </div>

                <div class="form-group">
                    <textarea id="codeEditor" spellcheck="false"></textarea>
                </div>

                <button type="button" class="btn btn-success" onclick="saveFileCode()">
                    <i class="fas fa-floppy-disk"></i> Сохранить изменения в коде
                </button>
            </div>
        </div>

        <div id="contacts" class="tab-content">
            <div class="admin-section">
                <div class="section-header">
                    <h3><i class="fas fa-paper-plane"></i> Настройки Discord Вебхуков</h3>
                </div>

                <div class="form-group">
                    <label>Вебхук LSSD</label>
                    <input type="text" id="webhook_lssd">
                </div>

                <div class="form-group">
                    <label>Вебхук LSPD</label>
                    <input type="text" id="webhook_lspd">
                </div>

                <div class="form-group">
                    <label>Вебхук GOV</label>
                    <input type="text" id="webhook_gov">
                </div>

                <div class="form-group">
                    <label>Вебхук CID</label>
                    <input type="text" id="webhook_cid">
                </div>

                <div class="form-group">
                    <label>Вебхук FIB</label>
                    <input type="text" id="webhook_fib">
                </div>

                <div class="form-group">
                    <label>ID Ролей для упоминания</label>
                    <input type="text" id="role_ids" placeholder="Например: 839596804785176577">
                </div>

                <button type="button" class="btn" onclick="saveSettings()">
                    <i class="fas fa-check"></i> Сохранить настройки
                </button>
            </div>
        </div>

    </div>

    <div id="toastContainer"></div>

    <script>
    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
        toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100%)';
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-links li').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    let allProjects = [];
    let currentProjImageUrl = '';

    function loadProjects() {
        fetch('/api/projects')
            .then(res => res.json())
            .then(data => {
                allProjects = data || [];
                let select = document.getElementById('projectSelect');
                select.innerHTML = '<option value="">-- Создать новый проект --</option>';
                allProjects.forEach((p, index) => {
                    let opt = document.createElement('option');
                    opt.value = index;
                    opt.textContent = p.title || ('Проект ' + (index + 1));
                    select.appendChild(opt);
                });
                selectProject();
            })
            .catch(err => showToast('Ошибка загрузки проектов', 'danger'));
    }
    loadProjects();

    function selectProject() {
        let idx = document.getElementById('projectSelect').value;
        let imgPreview = document.getElementById('projImgPreview');
        let deleteBtn = document.getElementById('deleteBtn');
        if (idx === "") {
            document.getElementById('projTitle').value = '';
            document.getElementById('projPath').value = '';
            document.getElementById('projShortDesc').value = '';
            document.getElementById('projFullDesc').value = '';
            currentProjImageUrl = '';
            imgPreview.src = '';
            imgPreview.style.display = 'none';
            deleteBtn.style.display = 'none';
        } else {
            let p = allProjects[idx];
            document.getElementById('projTitle').value = p.title || '';
            document.getElementById('projPath').value = p.path || '';
            document.getElementById('projShortDesc').value = p.shortDesc || p.desc || '';
            document.getElementById('projFullDesc').value = p.fullDesc || p.desc || '';
            currentProjImageUrl = p.imageUrl || p.image || '';
            if (currentProjImageUrl) {
                imgPreview.src = currentProjImageUrl;
                imgPreview.style.display = 'block';
            } else {
                imgPreview.src = '';
                imgPreview.style.display = 'none';
            }
            deleteBtn.style.display = 'inline-flex';
        }
    }

    function saveProjectWithImage() {
        let fileInput = document.getElementById('projImageFile');
        if (fileInput.files.length > 0) {
            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = function(e) {
                fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: e.target.result, filename: file.name })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        currentProjImageUrl = data.url;
                        saveProjectData();
                    } else {
                        showToast('Ошибка загрузки фотографии проекта', 'danger');
                    }
                });
            };
            reader.readAsDataURL(file);
        } else {
            saveProjectData();
        }
    }

    function saveProjectData() {
        let idx = document.getElementById('projectSelect').value;
        let projData = {
            title: document.getElementById('projTitle').value,
            path: document.getElementById('projPath').value,
            shortDesc: document.getElementById('projShortDesc').value,
            fullDesc: document.getElementById('projFullDesc').value,
            imageUrl: currentProjImageUrl
        };

        if (idx === "") {
            allProjects.push(projData);
        } else {
            allProjects[idx] = projData;
        }

        fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(allProjects)
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                showToast('Проект успешно сохранен!');
                loadProjects();
            } else {
                showToast('Ошибка сохранения проекта', 'danger');
            }
        });
    }

    function deleteProject() {
        let idx = document.getElementById('projectSelect').value;
        if (idx === "") return;
        if (!confirm('Вы действительно хотите удалить этот проект?')) return;

        allProjects.splice(idx, 1);
        fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(allProjects)
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                showToast('Проект успешно удален!');
                document.getElementById('projectSelect').value = "";
                loadProjects();
            } else {
                showToast('Ошибка удаления', 'danger');
            }
        });
    }

    function loadSettings() {
        fetch('/api/settings')
            .then(res => res.json())
            .then(data => {
                document.getElementById('webhook_lssd').value = data.webhook_lssd || '';
                document.getElementById('webhook_lspd').value = data.webhook_lspd || '';
                document.getElementById('webhook_gov').value = data.webhook_gov || '';
                document.getElementById('webhook_cid').value = data.webhook_cid || '';
                document.getElementById('webhook_fib').value = data.webhook_fib || '';
                document.getElementById('role_ids').value = data.role_ids || '';
                if(data.illustrationUrl) {
                    let img = document.getElementById('currentIllustration');
                    img.src = data.illustrationUrl;
                    img.style.display = 'block';
                }
            });
    }
    loadSettings();

    function saveSettings() {
        fetch('/api/settings')
            .then(res => res.json())
            .then(currentData => {
                currentData.webhook_lssd = document.getElementById('webhook_lssd').value;
                currentData.webhook_lspd = document.getElementById('webhook_lspd').value;
                currentData.webhook_gov = document.getElementById('webhook_gov').value;
                currentData.webhook_cid = document.getElementById('webhook_cid').value;
                currentData.webhook_fib = document.getElementById('webhook_fib').value;
                currentData.role_ids = document.getElementById('role_ids').value;

                return fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentData)
                });
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    showToast('Настройки успешно сохранены!');
                } else {
                    showToast('Ошибка сохранения', 'danger');
                }
            });
    }

    function uploadIllustration() {
        let fileInput = document.getElementById('illustrationFile');
        if(fileInput.files.length === 0) {
            showToast('Выберите файл иллюстрации!', 'danger');
            return;
        }
        let file = fileInput.files[0];
        let reader = new FileReader();
        reader.onload = function(e) {
            fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: e.target.result, filename: file.name })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    let newUrl = data.url;
                    fetch('/api/settings')
                        .then(res => res.json())
                        .then(settings => {
                            settings.illustrationUrl = newUrl;
                            return fetch('/api/settings', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(settings)
                            });
                        })
                        .then(res => res.json())
                        .then(stData => {
                            if (stData.success) {
                                showToast('Иллюстрация успешно обновлена!');
                                let img = document.getElementById('currentIllustration');
                                img.src = newUrl;
                                img.style.display = 'block';
                            }
                        });
                } else {
                    showToast('Ошибка загрузки иллюстрации', 'danger');
                }
            });
        };
        reader.readAsDataURL(file);
    }

    function fetchLogs() {
        fetch('/api/logs')
            .then(res => res.json())
            .then(data => {
                const logsEl = document.getElementById('serverLogs');
                logsEl.innerText = data.logs || 'Логов пока нет';
                logsEl.scrollTop = logsEl.scrollHeight;
            });
    }
    fetchLogs();

    function loadFileList() {
        fetch('/api/list-files')
            .then(res => res.json())
            .then(files => {
                let select = document.getElementById('fileSelect');
                select.innerHTML = '';
                if (files && files.length > 0) {
                    files.forEach(f => {
                        let opt = document.createElement('option');
                        opt.value = f;
                        opt.textContent = f;
                        select.appendChild(opt);
                    });
                    loadFileCode();
                }
            });
    }
    loadFileList();

    function loadFileCode() {
        let file = document.getElementById('fileSelect').value;
        if (!file) return;
        fetch('/api/file?path=' + encodeURIComponent(file))
            .then(res => res.json())
            .then(data => {
                document.getElementById('codeEditor').value = data.content || '';
            });
    }

    function saveFileCode() {
        let file = document.getElementById('fileSelect').value;
        let content = document.getElementById('codeEditor').value;
        fetch('/api/file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filePath: file, content: content })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                showToast('Файл с кодом успешно сохранен!');
            } else {
                showToast('Ошибка: ' + data.error, 'danger');
            }
        });
    }
    </script>
</body>
</html>
