<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #050505; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #0a0a0a; padding: 40px; border-radius: 12px; border: 1px solid #2a114d; width: 400px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .login-box h2 { color: #fff; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 20px; background: #11051f; border: 1px solid #4a1587; color: #fff; border-radius: 8px; outline: none; transition: 0.3s; }
        .login-box input:focus { border-color: #b026ff; box-shadow: 0 0 15px rgba(138, 43, 226, 0.3); }
        .login-box button { width: 100%; padding: 15px; background: #8a2be2; border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .login-box button:hover { background: #b026ff; box-shadow: 0 0 20px rgba(176, 38, 255, 0.4); }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Авторизация</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Логин" required autocomplete="off">
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
